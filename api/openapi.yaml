openapi: 3.0.3
info:
  title: Falky
  version: 0.1.0
  description: >-
    HTTP contract of the Falky server. Operations under `/api/` are served on
    the public listener; the others are served on the internal listener only.
servers:
  - url: /
    description: The listener that serves the operation.
# Every operation needs a visitor unless it says otherwise.
security:
  - visitorCookie: []
tags:
  - name: health
    description: Process and dependency health, on the internal listener.
  - name: visitors
    description: Entering through the access link, and the current visitor.
  - name: rooms
    description: The rooms visitors talk in by voice and chat.
paths:
  /api/enter:
    post:
      operationId: enter
      security: []
      tags: [visitors]
      summary: Enter with the access link's secret and a name.
      description: >-
        Exchanges the secret from the access link (the `k` value in its URL
        fragment) and a name for a new visitor, and sets the visitor cookie.
        The name is reserved for 60 seconds so that no one else can enter
        under it meanwhile. Attempts are limited per client IP, whether they
        succeed or not.
      requestBody:
        description: The secret and the name to enter under.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnterRequest"
      responses:
        "201":
          description: Entered; the body is the new visitor.
          headers:
            Set-Cookie:
              description: >-
                The visitor cookie `falky_visitor`: `HttpOnly`, `Secure`,
                `SameSite=Strict`, for `/api`. It is valid while the access
                link it was issued under is the current one.
              schema:
                type: string
                example: falky_visitor=6GQ3VQKXHVY4HRSMBJ2TQ5W7DA; Path=/api; Max-Age=34560000; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visitor"
        "400":
          $ref: "#/components/responses/InvalidName"
        "403":
          description: The secret is not the current access link's (`invalid_link`). No cookie is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/NameTaken"
        "429":
          description: Too many attempts from this client IP (`rate_limited`); try again later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/me:
    get:
      operationId: getMe
      tags: [visitors]
      summary: Return the current visitor.
      description: Returns the visitor the cookie belongs to.
      responses:
        "200":
          description: The current visitor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visitor"
        "401":
          $ref: "#/components/responses/VisitorRequired"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: renameMe
      tags: [visitors]
      summary: Change the current visitor's name.
      description: >-
        Renames the visitor the cookie belongs to. The new name must be free;
        the visitor's own current name always is.
      requestBody:
        description: The new name.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameRequest"
      responses:
        "200":
          description: Renamed; the body is the visitor with the new name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visitor"
        "400":
          $ref: "#/components/responses/InvalidName"
        "401":
          $ref: "#/components/responses/VisitorRequired"
        "409":
          $ref: "#/components/responses/NameTaken"
        default:
          $ref: "#/components/responses/Error"
  /api/rooms:
    get:
      operationId: listRooms
      tags: [rooms]
      summary: List every room with its occupancy.
      description: >-
        Returns every room, in the order they were created, each with the
        participants in its voice. The operator creates and renames rooms.
      responses:
        "200":
          description: Every room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomList"
        "401":
          $ref: "#/components/responses/VisitorRequired"
        default:
          $ref: "#/components/responses/Error"
  /api/rooms/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        description: The room's ID.
        schema:
          type: string
          example: 01JBX7A2K9D4F6H8M0P3R5T7VW
    get:
      operationId: listMessages
      tags: [rooms]
      summary: Read a page of a room's chat.
      description: >-
        Returns up to `limit` messages of the room. With `before`, the
        messages posted before that message, newest first, for paging back
        through history. With `after`, the messages posted after it, oldest
        first, for catching up. With neither, the newest messages, newest
        first. Message IDs sort in the order the messages were posted, so the
        last ID of one page is the cursor of the next.
      parameters:
        - name: before
          in: query
          required: false
          description: >-
            A message ID; only messages posted before it are returned. Cannot
            be combined with `after`. An empty value counts as absent.
          schema:
            type: string
            example: 01JBX8C4N2F6H8K0P3R5T7W9YZ
        - name: after
          in: query
          required: false
          description: >-
            A message ID; only messages posted after it are returned. Cannot be
            combined with `before`. An empty value counts as absent.
          schema:
            type: string
            example: 01JBX8C4N2F6H8K0P3R5T7W9YZ
        - name: limit
          in: query
          required: false
          description: The most messages to return; larger values are refused.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
            x-go-type-skip-optional-pointer: false
      responses:
        "200":
          description: The page of messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "400":
          description: >-
            The query is not allowed (`invalid_request`): `before` and `after`
            together, a cursor that is not a message ID, or a limit out of
            range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/VisitorRequired"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: postMessage
      tags: [rooms]
      summary: Post a message in a room's chat.
      description: >-
        Posts a message under the visitor's current name. Posting is
        idempotent by request key: posting again with the same key and body,
        say after a lost response, returns the message posted first and
        creates nothing. New messages are limited per visitor;
        such a repeat is not.
      requestBody:
        description: The message and its request key.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostMessageRequest"
      responses:
        "200":
          description: >-
            The visitor already posted this request key with this body in this
            room; the body is that message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "201":
          description: Posted; the body is the new message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: >-
            The message body breaks the message rules (`invalid_message`): empty
            or only white space, or longer than 4000 characters. A missing body
            counts as empty. A request key
            that breaks its rules, or a body that is not JSON of the request's
            shape, is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/VisitorRequired"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "409":
          description: >-
            The visitor already used this request key for a different body or
            in another room (`request_key_reused`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many messages from this visitor (`rate_limited`); try again later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /health/live:
    get:
      operationId: getLiveness
      security: []
      tags: [health]
      summary: Report that the process is running.
      description: Answers 200 while the process runs, whatever its dependencies.
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
  /health/ready:
    get:
      operationId: getReadiness
      security: []
      tags: [health]
      summary: Report whether the server can serve requests.
      description: >-
        Checks each component the server depends on and names it in the body.
        Answers 200 when every required component is `ok`, 503 otherwise.
      responses:
        "200":
          description: Every required component is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: At least one required component is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    visitorCookie:
      type: apiKey
      in: cookie
      name: falky_visitor
      description: >-
        The visitor cookie set by `POST /api/enter`. Requests without it, with
        an unknown one, or with one issued under a replaced access link are
        refused with 401 (`visitor_required`).
  responses:
    Error:
      description: The request failed; the body says why.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidName:
      description: >-
        The name is not allowed (`invalid_name`): empty after trimming, longer
        than 32 characters, or containing control characters. A missing name
        counts as empty. A body that is not JSON of the request's shape is
        `invalid_request`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NameTaken:
      description: Another visitor holds the name (`name_taken`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RoomNotFound:
      description: No room has this ID (`room_not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    VisitorRequired:
      description: >-
        The request has no valid visitor cookie (`visitor_required`); enter
        again through the access link.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      description: The body of every error response.
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            Stable, machine-readable error code: `not_found` (no such route),
            `invalid_request` (the request does not match the contract),
            `internal` (the server failed), `visitor_required` (no valid
            visitor cookie), `invalid_link` (wrong access link secret),
            `invalid_name` (a name breaks the name rules), `name_taken`
            (another visitor holds the name), `rate_limited` (too many
            requests), `room_not_found` (no such room), `invalid_message` (a
            message body breaks the message rules) or `request_key_reused`
            (a request key was already used for another message).
          example: not_found
        message:
          type: string
          description: Human-readable explanation; not meant for parsing.
          example: no such route
    Health:
      type: object
      description: Overall health and, for readiness, each checked component.
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        components:
          type: object
          description: Status of each checked component, by component name.
          additionalProperties:
            $ref: "#/components/schemas/HealthStatus"
          example:
            database: ok
    HealthStatus:
      type: string
      description: >-
        `ok` when available; `unavailable` when a required component cannot be
        used.
      enum: [ok, unavailable]
      example: ok
    Visitor:
      type: object
      description: A person who entered through the access link.
      required: [id, name]
      properties:
        id:
          type: string
          description: The visitor's ID, a ULID; it never changes.
          example: 01JBX6Z8Q3M5W2K7R9T4V1C0DE
        name:
          type: string
          description: The visitor's name, trimmed.
          example: Bob
    EnterRequest:
      type: object
      description: The access link's secret and the name to enter under.
      required: [secret, name]
      properties:
        secret:
          type: string
          description: The `k` value from the access link's URL fragment.
          example: 6GQ3VQKXHVY4HRSMBJ2TQ5W7DA
        name:
          $ref: "#/components/schemas/Name"
    RenameRequest:
      type: object
      description: The name the visitor changes to.
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/Name"
    Name:
      type: string
      description: >-
        A visitor's name: 1 to 32 characters once leading and trailing white
        space is trimmed, with no control characters (the bidirectional
        controls included). Names are compared
        trimmed and case-insensitively, so `" Bob "` and `bob` are the same
        name. The server checks these rules and answers `invalid_name`.
      example: Bob
    RoomList:
      type: object
      description: The list of rooms.
      required: [rooms]
      properties:
        rooms:
          type: array
          description: The rooms, in the order they were created.
          items:
            $ref: "#/components/schemas/Room"
          example:
            - id: 01JBX7A2K9D4F6H8M0P3R5T7VW
              name: Lounge
              occupancy:
                - visitorId: 01JBX6Z8Q3M5W2K7R9T4V1C0DE
                  name: Bob
            - id: 01JBX7B3M1E5G7J9N2Q4S6V8XY
              name: Games
              occupancy: []
    Room:
      type: object
      description: A named place where visitors talk by voice and chat.
      required: [id, name, occupancy]
      properties:
        id:
          type: string
          description: The room's ID, a ULID; it never changes.
          example: 01JBX7A2K9D4F6H8M0P3R5T7VW
        name:
          type: string
          description: >-
            The room's name. No two rooms have names that are the same when
            compared as visitor names are.
          example: Lounge
        occupancy:
          type: array
          description: The participants in the room's voice; empty when no one is in it.
          items:
            $ref: "#/components/schemas/Participant"
          example:
            - visitorId: 01JBX6Z8Q3M5W2K7R9T4V1C0DE
              name: Bob
    Participant:
      type: object
      description: A visitor connected to a room's voice.
      required: [visitorId, name]
      properties:
        visitorId:
          type: string
          description: The participant's visitor ID.
          example: 01JBX6Z8Q3M5W2K7R9T4V1C0DE
        name:
          type: string
          description: The participant's name.
          example: Bob
    Message:
      type: object
      description: >-
        A piece of text a visitor posted in a room's chat, under the name they
        had when posting.
      required: [id, roomId, authorId, authorName, body, createdAt]
      properties:
        id:
          type: string
          description: >-
            The message's ID, a ULID. IDs sort in the order messages were
            posted, and serve as history cursors.
          example: 01JBX8C4N2F6H8K0P3R5T7W9YZ
        roomId:
          type: string
          description: The ID of the room the message was posted in.
          example: 01JBX7A2K9D4F6H8M0P3R5T7VW
        authorId:
          type: string
          description: The visitor ID of the author.
          example: 01JBX6Z8Q3M5W2K7R9T4V1C0DE
        authorName:
          type: string
          description: The author's name when they posted; a later rename does not change it.
          example: Bob
        body:
          type: string
          description: The text, as posted.
          example: Anyone up for a game?
        createdAt:
          type: string
          format: date-time
          description: When the message was posted, in UTC.
          example: "2026-11-04T18:30:05.123Z"
    MessageList:
      type: object
      description: A page of a room's chat.
      required: [messages]
      properties:
        messages:
          type: array
          description: The messages, in the order the request asked for.
          items:
            $ref: "#/components/schemas/Message"
          example:
            - id: 01JBX8C4N2F6H8K0P3R5T7W9YZ
              roomId: 01JBX7A2K9D4F6H8M0P3R5T7VW
              authorId: 01JBX6Z8Q3M5W2K7R9T4V1C0DE
              authorName: Bob
              body: Anyone up for a game?
              createdAt: "2026-11-04T18:30:05.123Z"
    PostMessageRequest:
      type: object
      description: A message to post and the key that makes retrying it safe.
      required: [requestKey, body]
      properties:
        requestKey:
          type: string
          description: >-
            Chosen by the client, new for each message and reused only to
            retry the same post, for example a random UUID: 1 to 64 letters,
            digits, `-` or `_`. Keys are per visitor.
          pattern: "^[A-Za-z0-9_-]{1,64}$"
          example: 3f1c2a9e-7b4d-4e8a-9c61-2d5f0b8e7a13
        body:
          type: string
          description: >-
            The text: 1 to 4000 characters, not only white space. It is kept as
            sent, untrimmed.
          example: Anyone up for a game?
