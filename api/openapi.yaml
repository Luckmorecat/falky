openapi: 3.0.3
info:
  title: Falky
  version: 0.1.0
  description: >-
    HTTP contract of the Falky server. Operations under `/api/` are served on
    the public listener; the others are served on the internal listener only.
servers:
  - url: /
    description: The listener that serves the operation.
# Every operation needs a visitor unless it says otherwise.
security:
  - visitorCookie: []
tags:
  - name: accounts
    description: Invitation-only passkey accounts and owner recovery.
  - name: health
    description: Process and dependency health, on the internal listener.
  - name: visitors
    description: Guest entry through the access link and the current guest or account identity.
  - name: rooms
    description: The rooms visitors talk in by voice and chat.
  - name: attachments
    description: Private room attachments, limits, status and content.
  - name: live
    description: Live updates the server pushes over a WebSocket.
  - name: voice
    description: Who is in each room's voice, as LiveKit reports it, on the internal listener.
paths:
  /api/accounts/signin-links:
    post:
      operationId: createSignInLink
      tags:
      - accounts
      summary: Create a five-minute link.
      description: Exact configured Origin is required for mutations; JSON objects are limited to 64 KiB.
        Responses use no-store. Unknown, expired, revoked, wrong-flow or wrong-bound proofs return 403 invalid_proof.
        Conflicts return 409 account_switch_required, already_signed_in, pending_request_cap or signin_conflict.
        Limits return 429 rate_limited and Retry-After seconds. No response event delivers a session cookie.
        Any valid account session; replaces its previous active link. Uses account IP attempt limit.
      requestBody:
        required: true
        description: JSON input for createSignInLink.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountEmpty'
      responses:
        '200':
          description: Authorized durable result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInLinkResult'
          headers:
            Set-Cookie:
              description: Secure HttpOnly Strict cookie; binding uses Path=/ and Max-Age=600, session uses
                Path=/api and remaining absolute lifetime.
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
        '429':
          description: Attempt, allocation, concurrency or persisted cooldown limit.
          headers:
            Retry-After:
              description: Whole seconds to wait, rounded upward; in-memory token buckets refill continuously
                and reset on process restart.
              schema:
                type: integer
                minimum: 1
                example: 3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/accounts/signin-links/{linkId}:
    get:
      operationId: getSignInLink
      tags:
      - accounts
      summary: Recover exact-issuer link state.
      description: Exact configured Origin is required for mutations; JSON objects are limited to 64 KiB.
        Responses use no-store. Unknown, expired, revoked, wrong-flow or wrong-bound proofs return 403 invalid_proof.
        Conflicts return 409 account_switch_required, already_signed_in, pending_request_cap or signin_conflict.
        Limits return 429 rate_limited and Retry-After seconds. No response event delivers a session cookie.
        Other sessions of the same account cannot inspect this link.
      parameters:
      - name: linkId
        in: path
        required: true
        description: Public opaque identifier; does not grant authorization.
        schema:
          type: string
          description: Opaque identifier.
          example: linkId-example
      responses:
        '200':
          description: Authorized durable result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInLink'
        default:
          $ref: '#/components/responses/Error'
        '429':
          description: Attempt, allocation, concurrency or persisted cooldown limit.
          headers:
            Retry-After:
              description: Whole seconds to wait, rounded upward; in-memory token buckets refill continuously
                and reset on process restart.
              schema:
                type: integer
                minimum: 1
                example: 3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: revokeSignInLink
      tags:
      - accounts
      summary: Revoke an unconsumed link.
      description: Exact configured Origin is required for mutations; JSON objects are limited to 64 KiB.
        Responses use no-store. Unknown, expired, revoked, wrong-flow or wrong-bound proofs return 403 invalid_proof.
        Conflicts return 409 account_switch_required, already_signed_in, pending_request_cap or signin_conflict.
        Limits return 429 rate_limited and Retry-After seconds. No response event delivers a session cookie.
        Exact issuer only; cancels waiting candidates.
      parameters:
      - name: linkId
        in: path
        required: true
        description: Public opaque identifier; does not grant authorization.
        schema:
          type: string
          description: Opaque identifier.
          example: linkId-example
      responses:
        '200':
          description: Authorized durable result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountEmpty'
        default:
          $ref: '#/components/responses/Error'
        '429':
          description: Attempt, allocation, concurrency or persisted cooldown limit.
          headers:
            Retry-After:
              description: Whole seconds to wait, rounded upward; in-memory token buckets refill continuously
                and reset on process restart.
              schema:
                type: integer
                minimum: 1
                example: 3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/accounts/signin-links/{linkId}/approve:
    post:
      operationId: approveSignInLink
      tags:
      - accounts
      summary: Approve a candidate code.
      description: Exact configured Origin is required for mutations; JSON objects are limited to 64 KiB.
        Responses use no-store. Unknown, expired, revoked, wrong-flow or wrong-bound proofs return 403 invalid_proof.
        Conflicts return 409 account_switch_required, already_signed_in, pending_request_cap or signin_conflict.
        Limits return 429 rate_limited and Retry-After seconds. No response event delivers a session cookie.
        Exact issuer only. Five incorrect codes durably revoke the link even though the fifth response rejects
        the proof.
      parameters:
      - name: linkId
        in: path
        required: true
        description: Public opaque identifier; does not grant authorization.
        schema:
          type: string
          description: Opaque identifier.
          example: linkId-example
      requestBody:
        required: true
        description: JSON input for approveSignInLink.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInCode'
      responses:
        '200':
          description: Authorized durable result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInRequest'
        default:
          $ref: '#/components/responses/Error'
        '429':
          description: Attempt, allocation, concurrency or persisted cooldown limit.
          headers:
            Retry-After:
              description: Whole seconds to wait, rounded upward; in-memory token buckets refill continuously
                and reset on process restart.
              schema:
                type: integer
                minimum: 1
                example: 3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/accounts/signin-links/{linkId}/requests/{requestId}/deny:
    post:
      operationId: denySignInRequest
      tags:
      - accounts
      summary: Deny a pending link candidate.
      description: Exact configured Origin is required for mutations; JSON objects are limited to 64 KiB.
        Responses use no-store. Unknown, expired, revoked, wrong-flow or wrong-bound proofs return 403 invalid_proof.
        Conflicts return 409 account_switch_required, already_signed_in, pending_request_cap or signin_conflict.
        Limits return 429 rate_limited and Retry-After seconds. No response event delivers a session cookie.
        Exact issuer only. Denied bindings cannot rejoin this link.
      parameters:
      - name: linkId
        in: path
        required: true
        description: Public opaque identifier; does not grant authorization.
        schema:
          type: string
          description: Opaque identifier.
          example: linkId-example
      - name: requestId
        in: path
        required: true
        description: Public opaque identifier; does not grant authorization.
        schema:
          type: string
          description: Opaque identifier.
          example: requestId-example
      requestBody:
        required: true
        description: JSON input for denySignInRequest.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountEmpty'
      responses:
        '200':
          description: Authorized durable result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountEmpty'
        default:
          $ref: '#/components/responses/Error'
        '429':
          description: Attempt, allocation, concurrency or persisted cooldown limit.
          headers:
            Retry-After:
              description: Whole seconds to wait, rounded upward; in-memory token buckets refill continuously
                and reset on process restart.
              schema:
                type: integer
                minimum: 1
                example: 3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/accounts/signin-requests:
    post:
      operationId: beginSignInRequest
      tags:
      - accounts
      summary: Begin or resume a bound link request.
      description: 'Exact configured Origin is required for mutations; JSON objects are limited to 64 KiB.
        Responses use no-store. Unknown, expired, revoked, wrong-flow or wrong-bound proofs return 403 invalid_proof.
        Conflicts return 409 account_switch_required, already_signed_in, pending_request_cap or signin_conflict.
        Limits return 429 rate_limited and Retry-After seconds. No response event delivers a session cookie.
        Independent IP token bucket burst 20, refill one per 3 seconds, separate from passkey and QR limits.
        At most three pending candidates per link. Successful begin sets or refreshes __Host-falky-signin:
        host-only Path=/, Secure, HttpOnly, SameSite=Strict, Max-Age=600. Binding survives logout.'
      security: []
      requestBody:
        required: true
        description: JSON input for beginSignInRequest.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInToken'
      responses:
        '200':
          description: Authorized durable result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInBegin'
          headers:
            Set-Cookie:
              description: Secure HttpOnly Strict cookie; binding uses Path=/ and Max-Age=600, session uses
                Path=/api and remaining absolute lifetime.
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
        '429':
          description: Attempt, allocation, concurrency or persisted cooldown limit.
          headers:
            Retry-After:
              description: Whole seconds to wait, rounded upward; in-memory token buckets refill continuously
                and reset on process restart.
              schema:
                type: integer
                minimum: 1
                example: 3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/accounts/qr-signins:
    post:
      operationId: beginQRSignIn
      tags:
      - accounts
      summary: Create, resume or replace a QR request.
      description: Exact configured Origin is required for mutations; JSON objects are limited to 64 KiB.
        Responses use no-store. Unknown, expired, revoked, wrong-flow or wrong-bound proofs return 403 invalid_proof.
        Conflicts return 409 account_switch_required, already_signed_in, pending_request_cap or signin_conflict.
        Limits return 429 rate_limited and Retry-After seconds. No response event delivers a session cookie.
        Independent HTTP IP bucket burst 20/refill one per 3 seconds. Actual allocations including replacement
        additionally charge browser-hash burst 3/refill one per 100 seconds and IP burst 10/refill one per
        30 seconds. Resume consumes no allocation quota; rejected quota preserves the old request. Sets
        or refreshes the dedicated secure ten-minute binding cookie.
      security: []
      requestBody:
        required: true
        description: JSON input for beginQRSignIn.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInQRInput'
      responses:
        '200':
          description: Authorized durable result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInBegin'
          headers:
            Set-Cookie:
              description: Secure HttpOnly Strict cookie; binding uses Path=/ and Max-Age=600, session uses
                Path=/api and remaining absolute lifetime.
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
        '429':
          description: Attempt, allocation, concurrency or persisted cooldown limit.
          headers:
            Retry-After:
              description: Whole seconds to wait, rounded upward; in-memory token buckets refill continuously
                and reset on process restart.
              schema:
                type: integer
                minimum: 1
                example: 3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/accounts/qr-signins/preview:
    post:
      operationId: previewQRSignIn
      tags:
      - accounts
      summary: Preview a QR without claiming it.
      description: Exact configured Origin is required for mutations; JSON objects are limited to 64 KiB.
        Responses use no-store. Unknown, expired, revoked, wrong-flow or wrong-bound proofs return 403 invalid_proof.
        Conflicts return 409 account_switch_required, already_signed_in, pending_request_cap or signin_conflict.
        Limits return 429 rate_limited and Retry-After seconds. No response event delivers a session cookie.
        Account required. Preview, approval and denial share session burst 10/refill one per 6 seconds in
        addition to account IP burst 20/refill one per 3 seconds.
      requestBody:
        required: true
        description: JSON input for previewQRSignIn.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInToken'
      responses:
        '200':
          description: Authorized durable result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInPreview'
        default:
          $ref: '#/components/responses/Error'
        '429':
          description: Attempt, allocation, concurrency or persisted cooldown limit.
          headers:
            Retry-After:
              description: Whole seconds to wait, rounded upward; in-memory token buckets refill continuously
                and reset on process restart.
              schema:
                type: integer
                minimum: 1
                example: 3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/accounts/qr-signins/approve:
    post:
      operationId: approveQRSignIn
      tags:
      - accounts
      summary: Explicitly approve a QR request.
      description: Exact configured Origin is required for mutations; JSON objects are limited to 64 KiB.
        Responses use no-store. Unknown, expired, revoked, wrong-flow or wrong-bound proofs return 403 invalid_proof.
        Conflicts return 409 account_switch_required, already_signed_in, pending_request_cap or signin_conflict.
        Limits return 429 rate_limited and Retry-After seconds. No response event delivers a session cookie.
        Account required; first committed session wins. Shares authenticated QR session and account IP attempt
        limits.
      requestBody:
        required: true
        description: JSON input for approveQRSignIn.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInToken'
      responses:
        '200':
          description: Authorized durable result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInRequest'
        default:
          $ref: '#/components/responses/Error'
        '429':
          description: Attempt, allocation, concurrency or persisted cooldown limit.
          headers:
            Retry-After:
              description: Whole seconds to wait, rounded upward; in-memory token buckets refill continuously
                and reset on process restart.
              schema:
                type: integer
                minimum: 1
                example: 3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/accounts/qr-signins/deny:
    post:
      operationId: denyQRSignIn
      tags:
      - accounts
      summary: Deny a QR without selecting an account.
      description: Exact configured Origin is required for mutations; JSON objects are limited to 64 KiB.
        Responses use no-store. Unknown, expired, revoked, wrong-flow or wrong-bound proofs return 403 invalid_proof.
        Conflicts return 409 account_switch_required, already_signed_in, pending_request_cap or signin_conflict.
        Limits return 429 rate_limited and Retry-After seconds. No response event delivers a session cookie.
        Account required; shares authenticated QR session and account IP attempt limits.
      requestBody:
        required: true
        description: JSON input for denyQRSignIn.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInToken'
      responses:
        '200':
          description: Authorized durable result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountEmpty'
        default:
          $ref: '#/components/responses/Error'
        '429':
          description: Attempt, allocation, concurrency or persisted cooldown limit.
          headers:
            Retry-After:
              description: Whole seconds to wait, rounded upward; in-memory token buckets refill continuously
                and reset on process restart.
              schema:
                type: integer
                minimum: 1
                example: 3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/accounts/qr-signins/{requestId}:
    delete:
      operationId: cancelQRSignIn
      tags:
      - accounts
      summary: Cancel a bound unconsumed QR.
      description: Exact configured Origin is required for mutations; JSON objects are limited to 64 KiB.
        Responses use no-store. Unknown, expired, revoked, wrong-flow or wrong-bound proofs return 403 invalid_proof.
        Conflicts return 409 account_switch_required, already_signed_in, pending_request_cap or signin_conflict.
        Limits return 429 rate_limited and Retry-After seconds. No response event delivers a session cookie.
        Original binding required. Consumed replacement or cancellation conflicts.
      security:
      - signInBindingCookie: []
      parameters:
      - name: requestId
        in: path
        required: true
        description: Public opaque identifier; does not grant authorization.
        schema:
          type: string
          description: Opaque identifier.
          example: requestId-example
      responses:
        '200':
          description: Authorized durable result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountEmpty'
        default:
          $ref: '#/components/responses/Error'
        '429':
          description: Attempt, allocation, concurrency or persisted cooldown limit.
          headers:
            Retry-After:
              description: Whole seconds to wait, rounded upward; in-memory token buckets refill continuously
                and reset on process restart.
              schema:
                type: integer
                minimum: 1
                example: 3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/accounts/signin-requests/{requestId}:
    get:
      operationId: getSignInRequest
      tags:
      - accounts
      summary: Recover bound request state.
      description: Exact configured Origin is required for mutations; JSON objects are limited to 64 KiB.
        Responses use no-store. Unknown, expired, revoked, wrong-flow or wrong-bound proofs return 403 invalid_proof.
        Conflicts return 409 account_switch_required, already_signed_in, pending_request_cap or signin_conflict.
        Limits return 429 rate_limited and Retry-After seconds. No response event delivers a session cookie.
        Independent browser binding required; no account session required.
      security:
      - signInBindingCookie: []
      parameters:
      - name: requestId
        in: path
        required: true
        description: Public opaque identifier; does not grant authorization.
        schema:
          type: string
          description: Opaque identifier.
          example: requestId-example
      responses:
        '200':
          description: Authorized durable result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInRequest'
        default:
          $ref: '#/components/responses/Error'
        '429':
          description: Attempt, allocation, concurrency or persisted cooldown limit.
          headers:
            Retry-After:
              description: Whole seconds to wait, rounded upward; in-memory token buckets refill continuously
                and reset on process restart.
              schema:
                type: integer
                minimum: 1
                example: 3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/accounts/signin-requests/{requestId}/events:
    get:
      operationId: openSignInEvents
      x-lint-ignore: operation-success-response
      tags:
      - accounts
      summary: Open a private candidate WebSocket.
      description: 'Exact configured Origin is required for mutations; JSON objects are limited to 64 KiB.
        Responses use no-store. Unknown, expired, revoked, wrong-flow or wrong-bound proofs return 403 invalid_proof.
        Conflicts return 409 account_switch_required, already_signed_in, pending_request_cap or signin_conflict.
        Limits return 429 rate_limited and Retry-After seconds. No response event delivers a session cookie.
        Exact Origin and independent binding required. Initial authorized snapshot and subsequent hints
        carry account.signin.state_changed with SignInRequest payload. No room broadcasts or identity presence.
        One socket per request; newer replaces older, including at cap. Counts pending upgrades: 16 candidates
        per IP and 1024 globally. Independent handshake IP bucket burst 20/refill one per 3 seconds. Concurrency
        rejection Retry-After is 1 second. Terminal notices precede closure where possible. Healthy sockets
        close at the original deadline. Consumed reconnect validates the resulting session.'
      security:
      - signInBindingCookie: []
      parameters:
      - name: requestId
        in: path
        required: true
        description: Public opaque identifier; does not grant authorization.
        schema:
          type: string
          description: Opaque identifier.
          example: requestId-example
      responses:
        '101':
          description: Authorized durable result.
        default:
          $ref: '#/components/responses/Error'
        '429':
          description: Attempt, allocation, concurrency or persisted cooldown limit.
          headers:
            Retry-After:
              description: Whole seconds to wait, rounded upward; in-memory token buckets refill continuously
                and reset on process restart.
              schema:
                type: integer
                minimum: 1
                example: 3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/accounts/signin-requests/{requestId}/resend:
    post:
      operationId: resendSignInRequest
      tags:
      - accounts
      summary: Resend a pending link notification.
      description: Exact configured Origin is required for mutations; JSON objects are limited to 64 KiB.
        Responses use no-store. Unknown, expired, revoked, wrong-flow or wrong-bound proofs return 403 invalid_proof.
        Conflicts return 409 account_switch_required, already_signed_in, pending_request_cap or signin_conflict.
        Limits return 429 rate_limited and Retry-After seconds. No response event delivers a session cookie.
        Link token plus binding required. Reject QR flow. Persisted shared link cooldown 10 seconds returns
        429 with Retry-After rounded upward; account IP attempt limit also applies.
      security:
      - signInBindingCookie: []
      parameters:
      - name: requestId
        in: path
        required: true
        description: Public opaque identifier; does not grant authorization.
        schema:
          type: string
          description: Opaque identifier.
          example: requestId-example
      requestBody:
        required: true
        description: JSON input for resendSignInRequest.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInToken'
      responses:
        '200':
          description: Authorized durable result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountEmpty'
        default:
          $ref: '#/components/responses/Error'
        '429':
          description: Attempt, allocation, concurrency or persisted cooldown limit.
          headers:
            Retry-After:
              description: Whole seconds to wait, rounded upward; in-memory token buckets refill continuously
                and reset on process restart.
              schema:
                type: integer
                minimum: 1
                example: 3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/accounts/signin-requests/{requestId}/finish:
    post:
      operationId: finishSignInRequest
      tags:
      - accounts
      summary: Redeem approval or retry exact cookie delivery.
      description: Exact configured Origin is required for mutations; JSON objects are limited to 64 KiB.
        Responses use no-store. Unknown, expired, revoked, wrong-flow or wrong-bound proofs return 403 invalid_proof.
        Conflicts return 409 account_switch_required, already_signed_in, pending_request_cap or signin_conflict.
        Limits return 429 rate_limited and Retry-After seconds. No response event delivers a session cookie.
        Independent binding required. Link requires token, QR omits it. Creates exactly one 90-day session.
        Retries until the original request deadline return the same cookie using remaining session lifetime.
        Any different active session is protected, including a newer guest (409 signin_conflict). Uses account
        IP attempt limit.
      security:
      - signInBindingCookie: []
      parameters:
      - name: requestId
        in: path
        required: true
        description: Public opaque identifier; does not grant authorization.
        schema:
          type: string
          description: Opaque identifier.
          example: requestId-example
      requestBody:
        required: true
        description: JSON input for finishSignInRequest.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInFinishInput'
      responses:
        '200':
          description: Authorized durable result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSession'
          headers:
            Set-Cookie:
              description: Secure HttpOnly Strict cookie; binding uses Path=/ and Max-Age=600, session uses
                Path=/api and remaining absolute lifetime.
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
        '429':
          description: Attempt, allocation, concurrency or persisted cooldown limit.
          headers:
            Retry-After:
              description: Whole seconds to wait, rounded upward; in-memory token buckets refill continuously
                and reset on process restart.
              schema:
                type: integer
                minimum: 1
                example: 3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/accounts/registration/begin:
    post:
      operationId: beginRegistration
      tags:
      - accounts
      summary: Begin invitation-only enrollment.
      description: Requires exact configured Origin, JSON body (64 KiB maximum), and bounded per-client
        attempts. Begin sets a Secure HttpOnly SameSite=Strict __Host-falky-ceremony cookie; finish requires
        that same browser cookie and a genuine WebAuthn credential. Proof errors are generic. Sensitive
        changes require a verified passkey in this session within five minutes. All account responses prohibit
        caching.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationBegin'
            example:
              invitation: invitation-bearer
              name: Alice
        description: JSON input for beginRegistration.
      responses:
        '200':
          description: Successful operation. Enrollment replaces the browser session; recovery codes appear
            only when generated.
          headers:
