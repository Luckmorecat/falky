openapi: 3.0.3
info:
  title: Falky
  version: 0.1.0
  description: >-
    HTTP contract of the Falky server. Operations under `/api/` are served on
    the public listener; the others are served on the internal listener only.
servers:
  - url: /
    description: The listener that serves the operation.
# Every operation needs a visitor unless it says otherwise.
security:
  - visitorCookie: []
tags:
  - name: accounts
    description: The access password, password accounts and their recovery.
  - name: health
    description: Process and dependency health, on the internal listener.
  - name: visitors
    description: The signed-in identity's name and colour.
  - name: rooms
    description: The rooms visitors talk in by voice and chat.
  - name: attachments
    description: Private room attachments, limits, status and content.
  - name: live
    description: Live updates the server pushes over a WebSocket.
  - name: voice
    description: Who is in each room's voice, as LiveKit reports it, on the internal listener.
paths:
  /api/access:
    get:
      operationId: getAccess
      security: []
      tags: [accounts]
      summary: Say whether this browser may sign in or register.
      description: >-
        Reports whether the operator has set the access password, whether
        this browser holds a current access pass (the `falky_access` cookie),
        and, for a browser that still holds a guest session from before
        accounts, the name that guest had: such a browser may register
        without the access password and keeps the guest's history.
      responses:
        "200":
          description: The browser's access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Access"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: passAccess
      security: []
      tags: [accounts]
      summary: Give the access password.
      description: >-
        Checks the access password and sets the `falky_access` cookie
        (`HttpOnly`, `Secure`, `SameSite=Strict`, for `/api`, 400 days), which
        signing in, registering and recovering require. Changing the access
        password ends every pass but no account session. Requires this
        server's exact `Origin`; attempts are limited per client IP.
      requestBody:
        description: The access password.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessRequest"
      responses:
        "200":
          description: The password is right; the body is the browser's access now.
          headers:
            Set-Cookie:
              description: The `falky_access` cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Access"
        "403":
          description: The access password is wrong (`invalid_access_password`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: The operator has not set the access password yet (`access_unset`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/accounts/register:
    post:
      operationId: register
      security: []
      tags: [accounts]
      summary: Create an account and sign in.
      description: >-
        Creates an account with a login, a password and the name others see,
        and sets the session cookie. Requires the access pass, or a guest session from
        before accounts, whose identity, history and colour the account then
        keeps; without either it answers `access_required` before checking
        anything else. Requires this server's exact `Origin`; attempts are
        limited per client IP.
      requestBody:
        description: The new account.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Registered and signed in.
          headers:
            Set-Cookie:
              description: The session cookie `falky_visitor`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEnrollment"
        "400":
          description: >-
            The login (`invalid_login`), password (`invalid_password`) or name
            (`invalid_name`) breaks its rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/AccessRequired"
        "409":
          description: Another account has this login (`login_taken`) or name (`name_taken`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /api/accounts/login:
    post:
      operationId: login
      security: []
      tags: [accounts]
      summary: Sign in with a login and password.
      description: >-
        Requires the access pass. An unknown login and a wrong password both
        answer `invalid_credentials`; attempts are limited per client IP and
        per login. Requires this server's exact `Origin`.
      requestBody:
        description: The login and password.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: The session cookie `falky_visitor`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEnrollment"
        "401":
          description: The login or password is wrong (`invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            No access pass (`access_required`), or the account is disabled
            (`account_disabled`), which is only said once the password is right.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /api/accounts/recovery:
    post:
      operationId: recover
      security: []
      tags: [accounts]
      summary: Set a new password with an operator recovery code.
      description: >-
        Requires the access pass. With a code the operator issued (`falky
        account recover`), sets a new password, and a new login when one is
        given, ends every session of the account and signs this browser in. An account from before
        passwords has no login and must be given one (`login_required`).
        Requires this server's exact `Origin`; attempts are limited per
        client IP.
      requestBody:
        description: The proof and the new password.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryRequest"
      responses:
        "200":
          description: Recovered and signed in.
          headers:
            Set-Cookie:
              description: The session cookie `falky_visitor`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEnrollment"
        "400":
          description: >-
            The password (`invalid_password`) or login (`invalid_login`)
            breaks its rules, or the account needs a login (`login_required`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            No access pass (`access_required`), or the account or code does
            not match a current, enabled account (`invalid_proof`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Another account has this login (`login_taken`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /api/accounts/password:
    put:
      operationId: changePassword
      tags: [accounts]
      summary: Change the password, given the current one.
      description: >-
        Ends every other session of the account; this one stays signed in.
        Requires this server's exact `Origin`.
      requestBody:
        description: The current and new passwords.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEmpty"
        "400":
          description: The new password breaks its rules (`invalid_password`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/VisitorRequired"
        "403":
          description: The current password is wrong (`invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/accounts/logout:
    post:
      operationId: logout
      tags: [accounts]
      summary: End this browser's session.
      description: >-
        Ends this session, closes its live updates and voice, and clears the
        session cookie. Requires this server's exact `Origin`.
      requestBody:
        description: An empty object.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountEmpty"
      responses:
        "200":
          description: Signed out.
          headers:
            Set-Cookie:
              description: Clears the session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEmpty"
        "401":
          $ref: "#/components/responses/VisitorRequired"
        default:
          $ref: "#/components/responses/Error"
  /api/accounts/session:
    get:
      operationId: getAccountSession
      tags: [accounts]
      summary: Read the current session.
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSession"
        "401":
          $ref: "#/components/responses/VisitorRequired"
        default:
          $ref: "#/components/responses/Error"
  /api/rooms/{id}/attachments:
    parameters:
    - $ref: '#/components/parameters/RoomId'
    post:
      operationId: uploadAttachment
      tags:
      - attachments
      summary: Upload one private draft into an existing room.
      description: Authenticates, checks Origin and authorizes the room before reading multipart headers
        or payload. Send exactly one file part named file; no fields or extra parts. Maximum input 25 MiB,
        total multipart overhead 16 KiB, initial headers 8 KiB, at most 8 headers and a 255-byte filename.
        Boundary at most 70 bytes. The actual read deadline is 60 seconds. Nonempty Origin must match this
        server; authenticated non-browser clients may omit it. No CORS is enabled. Success is a private
        one-hour draft. Upload rate is independent of message posting; burst 4, one refill per 15 seconds.
      requestBody:
        required: true
        description: One streamed file; the client media type is ignored.
        content:
          multipart/form-data:
            example: {file: "file bytes"}
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: One arbitrary file, at most 26,214,400 bytes.
                  example: file bytes
      responses:
        '201':
          description: The ready private draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          description: Malformed multipart or supported image (invalid_request, invalid_image, image_dimensions).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/VisitorRequired'
        '403':
          description: Foreign Origin (origin_forbidden).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/RoomNotFound'
        '408':
          description: Upload deadline elapsed (upload_timeout).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: File or multipart envelope exceeds its limit (attachment_too_large).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Upload rate, pending drafts or global streams exhausted (rate_limited, attachment_busy).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Bounded staging, cleanup, processing or shutdown capacity unavailable (attachment_capacity,
            attachment_processing, attachment_unavailable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/attachments/limits:
    get:
      operationId: getAttachmentLimits
      tags:
      - attachments
      summary: Read effective attachment limits.
      responses:
        '200':
          description: Effective limits; byte quantities use bytes and durations use seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentLimits'
        '401':
          $ref: '#/components/responses/VisitorRequired'
        default:
          $ref: '#/components/responses/Error'
  /api/attachments/{id}:
    parameters:
      - $ref: '#/components/parameters/AttachmentId'
    get:
      operationId: getAttachment
      tags:
      - attachments
      summary: Read current attachment status.
      description: 'Drafts are owner-only; unknown and foreign draft IDs both return 404. Posted metadata
        and tombstones are readable by visitors authorized for the actual room. Events are not replayed:
        after reconnect, refresh each previously visible attachment through this endpoint even when no new
        messages arrived.'
      responses:
        '200':
          description: Current metadata, including expired or cancelled availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '401':
          $ref: '#/components/responses/VisitorRequired'
        '404':
          description: Unknown or unauthorized attachment (attachment_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: cancelAttachment
      tags:
      - attachments
      summary: Cancel an owned private draft.
      description: Repeatable for owned draft tombstones. Cannot delete posted content. Nonempty Origin
        must match this server; absent Origin is allowed for non-browser clients.
      responses:
        '204':
          description: The draft is cancelled.
        '401':
          $ref: '#/components/responses/VisitorRequired'
        '403':
          description: Foreign Origin (origin_forbidden).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown, foreign or posted ID (attachment_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/attachments/{id}/content:
    parameters:
      - $ref: '#/components/parameters/AttachmentId'
    get:
      operationId: getAttachmentContent
      tags:
      - attachments
      summary: Read private attachment content.
      description: Authenticates and authorizes the actual room on every read. Only optimized WebP is inline;
        all unchanged files are attachment downloads. Successful responses use Cache-Control private, no-cache
        and an ETag for the immutable stored bytes. If-None-Match returns 304 only after checking access
        and availability. Errors and metadata use no-store. Content uses nosniff, a safe filename and
        actual Content-Length. No range or public sharing URL. At most eight content streams globally,
        with a 120-second write deadline and an open file closed on completion.
      parameters:
        - in: header
          name: If-None-Match
          description: Previously received ETag(s), or an asterisk for any available representation.
          schema:
            type: string
      responses:
        '200':
          description: Stored bytes, with Content-Type, Content-Length and safe Content-Disposition.
          headers:
            ETag:
              description: Strong validator for the immutable stored bytes.
              schema:
                type: string
            Cache-Control:
              description: Browser-only storage with validation before reuse (private, no-cache).
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '304':
          description: Stored bytes are unchanged and still accessible; no response body.
          headers:
            ETag:
              description: Current strong validator.
              schema:
                type: string
            Cache-Control:
              description: Browser-only storage with validation before reuse (private, no-cache).
              schema:
                type: string
        '401':
          $ref: '#/components/responses/VisitorRequired'
        '404':
          description: Unknown or unauthorized attachment (attachment_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Expired or cancelled content (attachment_expired).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Global content streams exhausted (attachment_busy).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/me:
    get:
      operationId: getMe
      tags: [visitors]
      summary: Return the current visitor.
      description: >-
        Returns the signed-in account's identity. Account names are unique
        and stay reserved while the account is away or disabled, so
        `nameTaken` is false.
      responses:
        "200":
          description: The current visitor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visitor"
        "401":
          $ref: "#/components/responses/VisitorRequired"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: renameMe
      tags: [visitors]
      summary: Change the current visitor's name.
      description: >-
        Renames the signed-in account. It cannot take another account's name,
        including an offline or disabled account's. Changed identities receive a retryable live close (1001) to refresh
        their names, and current voice names are published in occupancy updates.
      requestBody:
        description: The new name.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameRequest"
      responses:
        "200":
          description: Renamed; the body is the visitor with the new name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visitor"
        "400":
          $ref: "#/components/responses/InvalidName"
        "401":
          $ref: "#/components/responses/VisitorRequired"
        "409":
          $ref: "#/components/responses/NameTaken"
        default:
          $ref: "#/components/responses/Error"
  /api/me/colour:
    put:
      operationId: setMyColour
      tags: [visitors]
      summary: Save the current visitor's colour.
      description: >-
        Saves only the cookie owner. Any palette is allowed, including duplicates.
        Every accepted save advances the persistent revision, including an unchanged
        palette, and broadcasts visitor.colour.changed to all live connections.
      requestBody:
        description: The exact palette to save.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColourRequest"
      responses:
        "200":
          description: The current confirmed assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorColour"
        "400":
          description: An unknown palette (invalid_palette); nothing is changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/VisitorRequired"
        default:
          $ref: "#/components/responses/Error"
  /api/visitor-colours:
    post:
      operationId: lookupVisitorColours
      tags: [visitors]
      summary: Read current colours for explicit visitor IDs.
      description: >-
        Returns current assignments, including disconnected historical authors whose
        access was revoked. Unknown IDs are omitted and repeated IDs appear once.
        At most 100 IDs per request; clients batch larger history sets. This reveals
        neither connection status nor a visitor roster. Read again after live opens
        to recover colour changes missed while disconnected.
      requestBody:
        description: The explicit visitor IDs to resolve.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitorColourLookup"
      responses:
        "200":
          description: The current confirmed assignments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorColourList"
        "400":
          description: A missing ID list or more than 100 IDs (invalid_request).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/VisitorRequired"
        default:
          $ref: "#/components/responses/Error"
  /api/rooms:
    get:
      operationId: listRooms
      tags: [rooms]
      summary: List every room with its occupancy.
      description: >-
        Returns every room, in the order they were created, each with the
        participants in its voice.
      responses:
        "200":
          description: Every room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomList"
        "401":
          $ref: "#/components/responses/VisitorRequired"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createRoom
      tags: [rooms]
      summary: Create a room.
      description: >-
        Any account may create a room, up to 50 rooms on the server and a few
        per account each minute. Everyone connected receives `room.changed`.
      requestBody:
        description: The room name.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomNameRequest"
      responses:
        "201":
          description: Created; the body is the new, empty room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/InvalidName"
        "401":
          $ref: "#/components/responses/VisitorRequired"
        "409":
          description: >-
            Another room has this name (`room_name_taken`), or the server has
            as many rooms as it allows (`room_limit`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /api/rooms/{id}:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    patch:
      operationId: renameRoom
      tags: [rooms]
      summary: Rename a room.
      description: >-
        Any account may rename any room; a room may change the case of its own
        name. Everyone connected receives `room.changed`.
      requestBody:
        description: The room name.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomNameRequest"
      responses:
        "200":
          description: Renamed; the body is the room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/InvalidName"
        "401":
          $ref: "#/components/responses/VisitorRequired"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "409":
          description: Another room has this name (`room_name_taken`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /api/rooms/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      operationId: listMessages
      tags: [rooms]
      summary: Read a page of a room's chat.
      description: >-
        Returns up to `limit` messages of the room. With `before`, the
        messages posted before that message, newest first, for paging back
        through history. With `after`, the messages posted after it, oldest
        first, for catching up. With neither, the newest messages, newest
        first. Message IDs sort in the order the messages were posted, so the
        last ID of one page is the cursor of the next.
      parameters:
        - name: before
          in: query
          required: false
          description: >-
            A message ID; only messages posted before it are returned. Cannot
            be combined with `after`. An empty value counts as absent.
          schema:
            type: string
            example: 01JBX8C4N2F6H8K0P3R5T7W9YZ
        - name: after
          in: query
          required: false
          description: >-
            A message ID; only messages posted after it are returned. Cannot be
            combined with `before`. An empty value counts as absent.
          schema:
            type: string
            example: 01JBX8C4N2F6H8K0P3R5T7W9YZ
        - name: limit
          in: query
          required: false
          description: The most messages to return; larger values are refused.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
            x-go-type-skip-optional-pointer: false
      responses:
        "200":
          description: The page of messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "400":
          description: >-
            The query is not allowed (`invalid_request`): `before` and `after`
            together, a cursor that is not a message ID, or a limit out of
            range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/VisitorRequired"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: postMessage
      tags: [rooms]
      summary: Post a message in a room's chat.
      description: >-
        Posts a message under the visitor's current name. Posting is
        idempotent by request key: posting again with the same key, body and ordered attachment IDs,
        say after a lost response, returns the message posted first and
        creates nothing. New messages are limited per visitor;
        such a repeat is not.
      requestBody:
        description: The message and its request key.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostMessageRequest"
      responses:
        "200":
          description: >-
            The visitor already posted this request key with this body and ordered attachments in this
            room; the body is that message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "201":
          description: Posted; the body is the new message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: >-
            The message body breaks the message rules (`invalid_message`): longer than 4000 characters, or empty/white space without attachments.
            Duplicate, foreign, expired, cancelled or consumed drafts are invalid_attachments. A missing body
            counts as empty. A request key
            that breaks its rules, or a body that is not JSON of the request's
            shape, is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/VisitorRequired"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "409":
          description: >-
            The visitor already used this request key for a different body, ordered attachment IDs or
            in another room (`request_key_reused`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Attachment quota or cleanup capacity is unavailable (attachment_capacity).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many messages from this visitor (`rate_limited`); try again later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/rooms/{id}/voice:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    post:
      operationId: joinVoice
      tags: [rooms]
      summary: Join a room's voice.
      requestBody:
        required: false
        description: Optional legacy body; confirmation is no longer required or used.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                confirmTransfer:
                  type: boolean
                  default: false
                  deprecated: true
                  description: Ignored. Every Join creates an independent connection.
      description: >-
        Returns the LiveKit URL and a token to connect to the room's voice
        with a LiveKit SDK. Every explicit Join authorizes a fresh independent
        connection, including repeated joins from the same session. Other tabs
        and devices remain connected, in the same room or different rooms.
        Local Leave, room switching and discarded setup credentials do not revoke
        grants immediately. Valid original or LiveKit-refreshed credentials may
        reconnect their original connection before ten continuous minutes of
        confirmed absence, while their token, session and room access remain valid.
        Successful reconnect cancels the idle countdown. Unused grants receive
        ten minutes from issuance. At the idle deadline the old grant is refused;
        a new explicit Join retrieves a fresh grant under the same valid login.
        Capacity counts connections, including other connections of this identity.
        Account requests require this server's exact configured Origin header.


        Every explicit Join receives a fresh immutable transport identity on
        every explicit Join, even for the same room and session. Its prefix before
        the dot is the permanent identity ID. Occupancy exposes both connectionId
        (the transport identity) and visitorId (the permanent identity).
        All credentials use guarded public signalling. Valid original and LiveKit
        refreshed JWTs reconnect after restart only through their exact persisted
        active grant and current browser session, expiry, kind, generation, room
        and name authorization. Unknown grants predating durable grant storage fail
        closed and require one explicit rejoin; browser sessions and their deadlines
        survive migration. The idle-grace migration preserves existing grants
        until authoritative activity establishes their absence window.
        Temporary disconnection, page exit and SDK Leave preserve the grant during
        its idle grace. Successful LiveKit listings establish absence, normally
        within the 30-second maintenance cadence; listing outages defer idle
        cleanup. Connected participants never expire merely for their age.
        Voice idle expiry does not log out the browser.
        The token may
        publish the microphone, a camera, a screen share and the screen share's
        audio, subscribe to the other participants, and update the
        participant's own attributes, but not send data messages. It expires
        10 minutes after it is issued, so connect right away; once connected,
        LiveKit renews it.


        Muted is the state of the microphone track. Deafened is the
        participant attribute `deafened`: a client sets it to `"true"` while
        it plays no one's audio, and also mutes its microphone, then sets it
        to `"false"` again; an absent attribute means not deafened. The
        other participants see it through the SDK, for example with
        `room.localParticipant.setAttributes({ deafened: 'true' })` in
        `livekit-client`.
      responses:
        "200":
          description: The credentials to connect with.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceCredentials"
        "403":
          description: Account voice requires this server's exact Origin (origin_forbidden).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/VisitorRequired"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "409":
          description: >-
            The room's voice already has as many participants as it admits
            (`room_full`). Existing connections are unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            The server cannot reach LiveKit (`voice_unavailable`); try again
            later. Existing connections are unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/live:
    get:
      operationId: openLive
      # A WebSocket upgrade succeeds with 101, which the linter does not count.
      x-lint-ignore: operation-success-response
      tags: [live]
      summary: Open the live-update WebSocket.
      description: >-
        Upgrades to a WebSocket over which the server sends live updates, each
        an `Event` as one JSON text message. The connection carries events from
        the server only: messages from the client are ignored, though one over
        32 KiB closes the connection with close code 1009. The upgrade's
        `Origin` must be the server's public origin. The server pings every 20
        seconds and closes a connection that does not answer within 10
        seconds. Each connection has a bounded queue of events waiting to be
        sent; a client that lets it fill up is disconnected with close code
        4000. Logout closes only that browser session; recovery closes old account
        sessions while preserving its new session; disablement closes that
        account's sessions. Revoked sessions close promptly with code 4001;
        established expired connections close at the next maintenance pass
        (normally within 30 seconds). Requests and reconnects reject expired
        sessions immediately using their original authoritative database deadline,
        without restart extension. Closed sessions cannot reconnect without current authorization.
        Name changes use retryable close 1001 so clients refresh their
        identity through GET /api/me. Shutdown also closes with code 1001.
        Events are not replayed: after a retryable disconnection a client
        reconnects first and then catches up through the other operations,
        reading each room's messages with `after` set to the last message ID
        it saw and the room list again. Events that arrive while it catches up
        may repeat what it reads; it keeps one message per message ID. It also
        refreshes every previously visible attachment through GET /api/attachments/{id}:
        catching up only new messages cannot recover missed attachments.expired events.


        A visitor is connected while they have at least one of these
        connections open. Account names stay reserved even while offline or
        disabled and cannot be taken by another account.
      parameters:
        - name: Origin
          in: header
          required: true
          description: The page's origin; it must be the server's public origin.
          schema:
            type: string
            example: https://falky.example
      responses:
        "101":
          description: Switched to the WebSocket protocol; events follow.
        "401":
          $ref: "#/components/responses/VisitorRequired"
        "403":
          description: >-
            The `Origin` is missing or is not the server's public origin
            (`origin_forbidden`). No WebSocket is opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            Another connection holds this identity's name (`name_taken`), as
            `GET /api/me` reports; rename first. No WebSocket is opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /health/live:
    get:
      operationId: getLiveness
      security: []
      tags: [health]
      summary: Report that the process is running.
      description: Answers 200 while the process runs, whatever its dependencies.
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
  /health/ready:
    get:
      operationId: getReadiness
      security: []
      tags: [health]
      summary: Report whether the server can serve requests.
      description: >-
        Checks each component the server depends on and names it in the body.
        Answers 200 when every required component is `ok`, 503 otherwise. The
        database is required. LiveKit is not: while it cannot be reached, it
        is `degraded`, as is the overall status, and only voice fails.
      responses:
        "200":
          description: >-
            Every required component is available; the status is `degraded`
            when an optional one is not.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: At least one required component is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
  /livekit/webhook:
    post:
      operationId: receiveLiveKitWebhook
      security:
        - liveKitSignature: []
      tags: [voice]
      summary: Receive an event from LiveKit.
      description: >-
        LiveKit reports here who joins and leaves each room's voice; the
        server keeps its view of every room's occupancy from these events and
        from LiveKit's participant listing, read when the server starts and
        every 30 seconds. A participant joined, left or failed to connect, or
        a room's voice closed; other events change nothing, and an event
        received again changes nothing more. A participant who may not be in
        that room's voice is removed from it instead of entering the view: an
        account with a revoked, expired or disabled session or stale voice
        grant, or a participant in a room other than
        their current voice grant. Public account admission is already fenced
        before reaching LiveKit; webhook/list reconciliation repairs the view.
        A change of occupancy is sent
        to every live-update connection as `occupancy.changed`.
      requestBody:
        description: The event, as LiveKit sends it.
        required: true
        content:
          application/webhook+json:
            schema:
              $ref: "#/components/schemas/LiveKitEvent"
      responses:
        "204":
          description: The event was applied.
        "400":
          description: >-
            The body is signed but is not a LiveKit event
            (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >-
            The request is not signed with the LiveKit API key, or its body
            does not match the signature (`webhook_unverified`). Nothing
            changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    AttachmentId:
      name: id
      in: path
      required: true
      description: The opaque attachment ID.
      schema:
        type: string
        example: 0123456789abcdef0123456789abcdef
    RoomId:
      name: id
      in: path
      required: true
      description: The room's ID.
      schema:
        type: string
        example: 01JBX7A2K9D4F6H8M0P3R5T7VW
  securitySchemes:
    visitorCookie:
      type: apiKey
      in: cookie
      name: falky_visitor
      description: >-
        The opaque `falky_visitor` session cookie set by registering, signing
        in or recovering: Secure, HttpOnly, SameSite=Strict, Path=/api. Sessions
        expire server-side 90 days after signing in, whatever the activity.
        Missing, unknown, signed-out, revoked or expired sessions and disabled
        accounts are refused with 401 (`visitor_required`).
    liveKitSignature:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        LiveKit's signature of a webhook: a JWT, without a `Bearer` prefix,
        signed with the LiveKit API secret, whose `sha256` claim is the
        base64 SHA-256 of the body.
  responses:
    AccessRequired:
      description: >-
        This browser has not given the current access password
        (`access_required`); give it with `POST /api/access` first.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many attempts (`rate_limited`); try again later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: The request failed; the body says why.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidName:
      description: >-
        The name is not allowed (`invalid_name`): empty after trimming, longer
        than 32 characters, or containing control characters. A missing name
        counts as empty. A body that is not JSON of the request's shape is
        `invalid_request`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NameTaken:
      description: Another account has this name (`name_taken`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RoomNotFound:
      description: No room has this ID (`room_not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    VisitorRequired:
      description: >-
        The request has no current account session (`visitor_required`);
        sign in, register or recover first.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    AccountEmpty:
      type: object
      additionalProperties: false
      properties: {}
      description: An empty operation input or successful result.
      example: {}
    Access:
      type: object
      additionalProperties: false
      required: [passwordSet, passed]
      properties:
        passwordSet:
          type: boolean
          description: Whether the operator has set the access password; until then no one can enter.
          example: true
        passed:
          type: boolean
          description: Whether this browser holds a current access pass.
          example: false
        guestName:
          type: string
          description: >-
            Present when this browser still holds a guest session from before
            accounts: that guest's name. Registering keeps the guest's history.
          example: Bob
      description: Whether this browser may sign in or register.
    AccessRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          description: The access password the operator shares.
          example: the shared access password
      description: The access password.
    Login:
      type: string
      description: >-
        What an account signs in with: 3 to 32 latin letters, digits, dots,
        dashes or underscores, starting with a letter or digit. Logins are
        compared case-insensitively and never shown to others.
      example: bob
    Password:
      type: string
      description: A password of 8 to 128 characters; there are no composition rules.
      example: correct horse battery staple
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [login, password, name]
      properties:
        login:
          $ref: "#/components/schemas/Login"
        password:
          $ref: "#/components/schemas/Password"
        name:
          $ref: "#/components/schemas/Name"
      description: The new account's login, password and the name others see.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login:
          $ref: "#/components/schemas/Login"
        password:
          $ref: "#/components/schemas/Password"
      description: A login and password.
    RecoveryRequest:
      type: object
      additionalProperties: false
      required: [account, proof, password]
      properties:
        account:
          type: string
          description: The account's login, or its ID as an operator recovery link carries it.
          example: bob
        proof:
          type: string
          description: The operator recovery code, exactly as given; it works once, for 30 minutes.
          example: 6GQ3VQKXHVY4HRSMBJ2TQ5W7DA6GQ3VQKXHVY4HRSMBJ2TQ5W7DA
        password:
          $ref: "#/components/schemas/Password"
        login:
          $ref: "#/components/schemas/Login"
      description: >-
        Proof of an account and its new password; `login`, when present,
        becomes the account's login.
    PasswordChange:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          $ref: "#/components/schemas/Password"
        newPassword:
          $ref: "#/components/schemas/Password"
      description: The current password and the one to change to.
    RoomNameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/Name"
      description: A room's name; rooms follow the same name rules as people.
    AccountSession:
      type: object
      additionalProperties: false
      required:
      - visitor
      - kind
      properties:
        visitor:
          $ref: '#/components/schemas/Visitor'
        kind:
          type: string
          enum:
          - account
          description: Current identity kind; only accounts sign in.
          example: account
        expiresAt:
          x-go-type-skip-optional-pointer: false
          type: string
          format: date-time
          description: Absolute server-side expiry, 90 days after signing in; ordinary activity does not extend it.
          example: '2027-02-07T12:00:00Z'
      description: Identity kind and absolute session lifetime.
      example:
        visitor:
          id: account-id
          name: Alice
          nameTaken: false
          colour:
            visitorId: account-id
            palette: sky
            revision: 1
        kind: account
        expiresAt: '2027-02-07T12:00:00Z'
    AccountEnrollment:
      type: object
      additionalProperties: false
      required:
      - session
      properties:
        session:
          $ref: '#/components/schemas/AccountSession'
      description: A new session. Once the identity change commits, the session is returned even if
        subsequent live or voice enforcement fails. Enforcement is attempted immediately, failures are
        logged, and maintenance retries pending enforcement and cleanup.
      example:
        session:
          visitor:
            id: account-id
            name: Alice
            nameTaken: false
            colour:
              visitorId: account-id
              palette: sky
              revision: 1
          kind: account
          expiresAt: '2027-02-07T12:00:00Z'
    Attachment:
      type: object
      description: Private metadata. Availability is ready (owned draft), posted, expired, or cancelled. Metadata
        survives expiry; private drafts retain expiresAt through expiry or cancellation. Posted
        records omit it. Content URL always requires the current visitor cookie.
      required:
      - id
      - filename
      - contentType
      - size
      - inline
      - width
      - height
      - availability
      - contentUrl
      properties:
        id:
          type: string
          description: Opaque attachment ID.
          example: 0123456789abcdef0123456789abcdef
        filename:
          type: string
          description: Safe original basename; optimized images use .webp.
          example: photo.webp
        contentType:
          type: string
          description: Actual stored media type, detected by the server.
          example: image/webp
        size:
          type: integer
          format: int64
          description: Actual stored bytes.
          example: 12345
        inline:
          type: boolean
          description: True only for optimized supported still images.
          example: true
        width:
          type: integer
          description: Optimized width; zero for unchanged files.
          example: 640
        height:
          type: integer
          description: Optimized height; zero for unchanged files.
          example: 480
        availability:
          type: string
          enum:
          - ready
          - posted
          - expired
          - cancelled
          description: Current availability.
          example: posted
        expiresAt:
          x-go-type-skip-optional-pointer: false
          type: string
          format: date-time
          description: Successful-upload draft deadline; absent after posting.
          example: '2026-11-08T12:00:00Z'
        contentUrl:
          type: string
          description: Authenticated content path, returning 410 when unavailable.
          example: /api/attachments/0123456789abcdef0123456789abcdef/content
    AttachmentsExpired:
      type: object
      description: Committed posted attachment expirations in the envelope room. Events are not replayed;
        refresh old visible IDs after reconnect.
      required:
      - attachmentIds
      properties:
        attachmentIds:
          type: array
          description: Expired posted IDs; never private draft IDs.
          items:
            type: string
          example:
          - 0123456789abcdef0123456789abcdef
    AttachmentLimits:
      type: object
      description: Effective resource ceilings. Durations are seconds; bytes exclude database, snapshots and
        conversion scratch from posted quota.
      required:
      - maxFileBytes
      - maxOutputBytes
      - stagingBytes
      - postedBytes
      - maxAttachments
      - maxPending
      - maxUploadStreams
      - maxPixels
      - maxEdge
      - maxDimension
      - draftTtlSeconds
      - processTimeoutSeconds
      - uploadTimeoutSeconds
      - uploadBurst
      - uploadRefillSeconds
      - multipartOverheadBytes
      - multipartHeaderBytes
      - maxContentStreams
      - contentTimeoutSeconds
      - maxConversions
      properties:
        maxFileBytes:
          type: integer
          format: int64
          description: maxFileBytes effective ceiling.
          example: 26214400
        maxOutputBytes:
          type: integer
          format: int64
          description: maxOutputBytes effective ceiling.
          example: 33554432
        stagingBytes:
          type: integer
          format: int64
          description: stagingBytes effective ceiling.
          example: 268435456
        postedBytes:
          type: integer
          format: int64
          description: postedBytes effective ceiling.
          example: 5000000000
        maxAttachments:
          type: integer
          format: int64
          description: maxAttachments effective ceiling.
          example: 4
        maxPending:
          type: integer
          format: int64
          description: maxPending effective ceiling.
          example: 4
        maxUploadStreams:
          type: integer
          format: int64
          description: maxUploadStreams effective ceiling.
          example: 4
        maxPixels:
          type: integer
          format: int64
          description: maxPixels effective ceiling.
          example: 24000000
        maxEdge:
          type: integer
          format: int64
          description: maxEdge effective ceiling.
          example: 16384
        maxDimension:
          type: integer
          format: int64
          description: maxDimension effective ceiling.
          example: 2560
        draftTtlSeconds:
          type: integer
          format: int64
          description: draftTtlSeconds effective ceiling.
          example: 3600
        processTimeoutSeconds:
          type: integer
          format: int64
          description: processTimeoutSeconds effective ceiling.
          example: 30
        uploadTimeoutSeconds:
          type: integer
          format: int64
          description: uploadTimeoutSeconds effective ceiling.
          example: 60
        uploadBurst:
          type: integer
          format: int64
          description: uploadBurst effective ceiling.
          example: 4
        uploadRefillSeconds:
          type: integer
          format: int64
          description: uploadRefillSeconds effective ceiling.
          example: 15
        multipartOverheadBytes:
          type: integer
          format: int64
          description: multipartOverheadBytes effective ceiling.
          example: 16384
        multipartHeaderBytes:
          type: integer
          format: int64
          description: multipartHeaderBytes effective ceiling.
          example: 8192
        maxContentStreams:
          type: integer
          format: int64
          description: maxContentStreams effective ceiling.
          example: 8
        contentTimeoutSeconds:
          type: integer
          format: int64
          description: contentTimeoutSeconds effective ceiling.
          example: 120
        maxConversions:
          type: integer
          format: int64
          description: maxConversions effective ceiling.
          example: 1
    Error:
      type: object
      description: The body of every error response.
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            Stable, machine-readable error code: `not_found` (no such route),
            `invalid_request` (the request does not match the contract),
            `internal` (the server failed), `visitor_required` (no valid
            visitor cookie), `access_required` (give the access password
            first), `invalid_access_password`, `access_unset` (no access
            password yet), `invalid_credentials` (wrong login or password),
            `account_disabled`, `invalid_login`, `login_taken`,
            `login_required`, `invalid_password`, `invalid_proof` (wrong
            or expired recovery code), `invalid_name` (a name breaks the name
            rules), `name_taken` (another account has the name),
            `room_name_taken`, `room_limit`, `rate_limited` (too many
            requests), `room_not_found` (no such room), `invalid_message` (a
            message body breaks the message rules), `request_key_reused`
            (a request key was already used for another message),
            `origin_forbidden` (a request from a forbidden origin), `room_full` (a room's voice admits no more participants)
            or `voice_unavailable` (the server cannot reach LiveKit). Attachment operations
            also use `attachment_not_found`, `attachment_expired`, `invalid_attachments`,
            `attachment_too_large`, `invalid_image`, `image_dimensions`, `attachment_busy`,
            `attachment_capacity`, `attachment_processing`, `attachment_unavailable` and
            `upload_timeout`; each operation documents their status and meaning.
          example: not_found
        message:
          type: string
          description: Human-readable explanation; not meant for parsing.
          example: no such route
    Health:
      type: object
      description: Overall health and, for readiness, each checked component.
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        components:
          type: object
          description: Status of each checked component, by component name.
          additionalProperties:
            $ref: "#/components/schemas/HealthStatus"
          example:
            database: ok
            livekit: ok
    HealthStatus:
      type: string
      description: >-
        `ok` when available; `degraded` when an optional component cannot be
        used, or overall when the server is ready although one cannot;
        `unavailable` when a required component cannot be used, or overall
        when the server is not ready because one cannot.
      enum: [ok, degraded, unavailable]
      example: ok
    Visitor:
      type: object
      description: An account's permanent identity, kept through recovery and from the guest it may have been.
      required: [id, name, nameTaken, colour]
      properties:
        id:
          type: string
          description: The visitor's ID, a ULID; it never changes.
          example: 01JBX6Z8Q3M5W2K7R9T4V1C0DE
        name:
          type: string
          description: The visitor's name, trimmed.
          example: Bob
        nameTaken:
          type: boolean
          description: >-
            Kept for older clients: account names are unique, so it is
            always false.
          example: false
        colour:
          $ref: "#/components/schemas/VisitorColour"
    PaletteName:
      type: string
      description: One of the shared sixteen visitor palettes.
      enum: [sky, apricot, lagoon, rose, violet, amber, moss, coral, indigo, plum, sunset, aurora, lime, clay, ocean, ruby]
      example: sky
    VisitorColour:
      type: object
      description: >-
        One persistent assignment. Revisions increase per visitor on every accepted
        save and survive restart. Equal revisions always identify the same palette.
        Clients merge by revision because events and responses may arrive out of order.
      required: [visitorId, palette, revision]
      properties:
        visitorId:
          type: string
          description: The existing visitor's ID.
          example: 01JBX6Z8Q3M5W2K7R9T4V1C0DE
        palette:
          $ref: "#/components/schemas/PaletteName"
        revision:
          type: integer
          format: int64
          minimum: 1
          description: The monotonically increasing per-visitor assignment revision.
          example: 1
    ColourRequest:
      type: object
      description: An explicit palette choice for the cookie owner.
      required: [palette]
      properties:
        palette:
          $ref: "#/components/schemas/PaletteName"
    VisitorColourLookup:
      type: object
      description: A bounded batch of explicit visitor IDs, never a roster query.
      required: [visitorIds]
      properties:
        visitorIds:
          type: array
          maxItems: 100
          description: Existing visitor IDs to look up; unknown IDs are omitted.
          items:
            type: string
          example: [01JBX6Z8Q3M5W2K7R9T4V1C0DE]
    VisitorColourList:
      type: object
      description: Current assignments for known IDs, deduplicated in request order.
      required: [colours]
      properties:
        colours:
          type: array
          description: The current assignments, including historical authors.
          example: [{visitorId: 01JBX6Z8Q3M5W2K7R9T4V1C0DE, palette: sky, revision: 1}]
          items:
            $ref: "#/components/schemas/VisitorColour"
    RenameRequest:
      type: object
      description: The name the visitor changes to.
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/Name"
    Name:
      type: string
      description: >-
        A visitor's name: 1 to 32 characters once leading and trailing white
        space is trimmed, with no control characters (the bidirectional
        controls included). Names are compared
        trimmed and case-insensitively, so `" Bob "` and `bob` are the same
        name. The server checks these rules and answers `invalid_name`.
      example: Bob
    RoomList:
      type: object
      description: The list of rooms.
      required: [rooms]
      properties:
        rooms:
          type: array
          description: The rooms, in the order they were created.
          items:
            $ref: "#/components/schemas/Room"
          example:
            - id: 01JBX7A2K9D4F6H8M0P3R5T7VW
              name: Lounge
              occupancy:
                - connectionId: 01JBX6Z8Q3M5W2K7R9T4V1C0DE.01JBX8C4N2F6H8K0P3R5T7W9YZ
                  visitorId: 01JBX6Z8Q3M5W2K7R9T4V1C0DE
                  name: Bob
            - id: 01JBX7B3M1E5G7J9N2Q4S6V8XY
              name: Games
              occupancy: []
    Room:
      type: object
      description: A named place where visitors talk by voice and chat.
      required: [id, name, occupancy]
      properties:
        id:
          type: string
          description: The room's ID, a ULID; it never changes.
          example: 01JBX7A2K9D4F6H8M0P3R5T7VW
        name:
          type: string
          description: >-
            The room's name. No two rooms have names that are the same when
            compared as visitor names are.
          example: Lounge
        occupancy:
          type: array
          description: The participants in the room's voice; empty when no one is in it.
          items:
            $ref: "#/components/schemas/Participant"
          example:
            - connectionId: 01JBX6Z8Q3M5W2K7R9T4V1C0DE.01JBX8C4N2F6H8K0P3R5T7W9YZ
              visitorId: 01JBX6Z8Q3M5W2K7R9T4V1C0DE
              name: Bob
    Participant:
      type: object
      description: One independent voice connection; an identity may have several.
      required: [connectionId, visitorId, name]
      properties:
        connectionId:
          type: string
          description: Immutable grant and LiveKit transport identity of this connection.
          example: 01JBX6Z8Q3M5W2K7R9T4V1C0DE.01JBX8C4N2F6H8K0P3R5T7W9YZ
        visitorId:
          type: string
          description: The permanent identity ID of the person using this connection.
          example: 01JBX6Z8Q3M5W2K7R9T4V1C0DE
        name:
          type: string
          description: The participant's name.
          example: Bob
    VoiceCredentials:
      type: object
      description: What a client connects to a room's voice with.
      required: [url, token, grantId]
      properties:
        grantId:
          type: string
          description: Immutable identifier of this independent connection and its LiveKit transport identity.
          example: 01JBX6Z8Q3M5W2K7R9T4V1C0DE.01JBX8C4N2F6H8K0P3R5T7W9YZ
        url:
          type: string
          description: >-
            Where to reach LiveKit, a `wss://` URL (`ws://` when run locally);
            pass it to the SDK as is.
          example: wss://falky.example
        token:
          type: string
          description: >-
            The LiveKit access token, a JWT; it admits the visitor to this
            room's voice for 10 minutes.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIwMUpCWDZaOFEzTTVXMks3UjlUNFYxQzBERSJ9.c2lnbmF0dXJl
    Message:
      type: object
      description: >-
        Text, attachments, or both a visitor posted in a room's chat, under the name they
        had when posting.
      required: [id, roomId, authorId, authorName, body, createdAt, attachments]
      properties:
        id:
          type: string
          description: >-
            The message's ID, a ULID. IDs sort in the order messages were
            posted, and serve as history cursors.
          example: 01JBX8C4N2F6H8K0P3R5T7W9YZ
        roomId:
          type: string
          description: The ID of the room the message was posted in.
          example: 01JBX7A2K9D4F6H8M0P3R5T7VW
        authorId:
          type: string
          description: The visitor ID of the author.
          example: 01JBX6Z8Q3M5W2K7R9T4V1C0DE
        authorName:
          type: string
          description: The author's name when they posted; a later rename does not change it.
          example: Bob
        body:
          type: string
          description: The text, as posted.
          example: Anyone up for a game?
        createdAt:
          type: string
          format: date-time
          description: When the message was posted, in UTC.
          example: "2026-11-04T18:30:05.123Z"
        attachments:
          type: array
          description: Ordered attachment metadata; always an array, empty for text-only messages.
          items:
            $ref: "#/components/schemas/Attachment"
          example: []
    MessageList:
      type: object
      description: A page of a room's chat.
      required: [messages]
      properties:
        messages:
          type: array
          description: The messages, in the order the request asked for.
          items:
            $ref: "#/components/schemas/Message"
          example:
            - id: 01JBX8C4N2F6H8K0P3R5T7W9YZ
              roomId: 01JBX7A2K9D4F6H8M0P3R5T7VW
              authorId: 01JBX6Z8Q3M5W2K7R9T4V1C0DE
              authorName: Bob
              body: Anyone up for a game?
              createdAt: "2026-11-04T18:30:05.123Z"
              attachments: []
    PostMessageRequest:
      type: object
      description: A message to post and the key that makes retrying it safe.
      required: [requestKey]
      properties:
        requestKey:
          type: string
          description: >-
            Chosen by the client, new for each message and reused only to
            retry the same post, for example a random UUID: 1 to 64 letters,
            digits, `-` or `_`. Keys are per visitor.
          pattern: "^[A-Za-z0-9_-]{1,64}$"
          example: 3f1c2a9e-7b4d-4e8a-9c61-2d5f0b8e7a13
        body:
          type: string
          description: >-
            Optional text, at most 4000 characters, kept untrimmed. At least
            non-whitespace text or one attachment is required.
          example: Anyone up for a game?
        attachmentIds:
          type: array
          maxItems: 4
          uniqueItems: true
          description: Ordered owned ready drafts in this room; omitted means no attachments.
          items:
            type: string
          example: [0123456789abcdef0123456789abcdef]
    Event:
      # Sent over the WebSocket, which no operation can reference.
      x-lint-ignore: oas3-unused-component
      type: object
      description: >-
        A live update, as sent over `GET /api/live`. `type` says what happened
        and which schema `payload` has: `message.created` carries a `Message`,
        `room.changed` a `RoomChange`, `occupancy.changed` an
        `OccupancyChange`, `visitor.colour.changed` a `VisitorColour`,
        `access.revoked` an `AccessRevoked`, `attachments.expired` an
        `AttachmentsExpired`. Clients ignore
        event types they do not know.
      required: [v, type, eventId, payload, timestamp]
      properties:
        v:
          type: integer
          description: The version of this envelope.
          enum: [1]
          example: 1
        type:
          $ref: "#/components/schemas/EventType"
        eventId:
          type: string
          description: The event's ID, a ULID, unique to this event.
          example: 01JBX8C4P0G7J9M1Q4S6V8X0ZA
        roomId:
          type: string
          description: >-
            Set on events about what happens inside one room, such as a new
            message: the room's ID. Such events reach only the visitors
            allowed into that room.
          example: 01JBX7A2K9D4F6H8M0P3R5T7VW
        payload:
          description: What happened, in the schema `type` names.
          oneOf:
            - $ref: "#/components/schemas/Message"
            - $ref: "#/components/schemas/RoomChange"
            - $ref: "#/components/schemas/OccupancyChange"
            - $ref: "#/components/schemas/AccessRevoked"
            - $ref: "#/components/schemas/VisitorColour"
            - $ref: "#/components/schemas/AttachmentsExpired"
        timestamp:
          type: string
          format: date-time
          description: When the server published the event, in UTC.
          example: "2026-11-04T18:30:05.140Z"
      example:
        v: 1
        type: message.created
        eventId: 01JBX8C4P0G7J9M1Q4S6V8X0ZA
        roomId: 01JBX7A2K9D4F6H8M0P3R5T7VW
        payload:
          id: 01JBX8C4N2F6H8K0P3R5T7W9YZ
          roomId: 01JBX7A2K9D4F6H8M0P3R5T7VW
          authorId: 01JBX6Z8Q3M5W2K7R9T4V1C0DE
          authorName: Bob
          body: Anyone up for a game?
          createdAt: "2026-11-04T18:30:05.123Z"
          attachments: []
        timestamp: "2026-11-04T18:30:05.140Z"
    EventType:
      type: string
      description: >-
        What an event reports: `message.created`, a message was posted (its
        payload is the `Message`); `room.changed`, a room was created or
        renamed (its payload is the `RoomChange`); `occupancy.changed`,
        someone joined or left a room's voice, or a participant's new name
        reached it (its payload is the `OccupancyChange`); `access.revoked`,
        kept for older clients and no longer sent (its payload is the `AccessRevoked`), and
        the server closes the connection next; `visitor.colour.changed`, an explicit
        saved colour change (its payload is the `VisitorColour`) to all visitors;
        `attachments.expired`, posted files expired in this room (its payload is
        `AttachmentsExpired`). Private drafts are never broadcast.
      enum: [message.created, room.changed, occupancy.changed, access.revoked, visitor.colour.changed, attachments.expired]
      example: message.created
    RoomChange:
      type: object
      description: A room as it is after being created or renamed.
      required: [id, name]
      properties:
        id:
          type: string
          description: The ID of the room created or renamed.
          example: 01JBX7A2K9D4F6H8M0P3R5T7VW
        name:
          type: string
          description: The room's name now.
          example: Lounge
    OccupancyChange:
      type: object
      description: >-
        A room's occupancy as it is after someone joined or left its voice:
        the whole list, so the latest event of a room is all a client keeps.
      required: [roomId, occupancy]
      properties:
        roomId:
          type: string
          description: The ID of the room.
          example: 01JBX7A2K9D4F6H8M0P3R5T7VW
        occupancy:
          type: array
          description: The participants in the room's voice now, by name; empty when no one is in it.
          items:
            $ref: "#/components/schemas/Participant"
          example:
            - connectionId: 01JBX6Z8Q3M5W2K7R9T4V1C0DE.01JBX8C4N2F6H8K0P3R5T7W9YZ
              visitorId: 01JBX6Z8Q3M5W2K7R9T4V1C0DE
              name: Bob
    AccessRevoked:
      type: object
      description: >-
        Why guest-link access ended, from before accounts replaced guests; the
        server no longer sends it. This event
        is not sent for account logout, recovery, disablement or session expiry;
        those close only the affected sessions with code 4001.
      required: [reason]
      properties:
        reason:
          type: string
          description: >-
            `link_replaced`: the guest access link was replaced, ending old
            guest sessions while preserving account sessions.
          enum: [link_replaced]
          example: link_replaced
    LiveKitEvent:
      type: object
      description: >-
        A LiveKit `WebhookEvent` in protobuf's JSON form. The server reads
        `event`, `room.name` and the `participant`'s `sid` and `identity`,
        and ignores everything else.
      properties:
        event:
          type: string
          description: >-
            What happened: `participant_joined`, `participant_left`,
            `participant_connection_aborted` and `room_finished` are applied.
          example: participant_joined
        room:
          type: object
          description: The LiveKit room, named by the room's ID.
          properties:
            name:
              type: string
              description: The ID of the room whose voice this is.
              example: 01JBX7A2K9D4F6H8M0P3R5T7VW
        participant:
          type: object
          description: The participant the event is about.
          properties:
            sid:
              type: string
              description: LiveKit's ID of this connection to the room's voice.
              example: PA_hEkRvX33WBhh
            identity:
              type: string
              description: The visitor ID the participant's token was issued to.
              example: 01JBX6Z8Q3M5W2K7R9T4V1C0DE
