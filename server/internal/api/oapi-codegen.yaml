# Generates internal/api/api.gen.go from api/openapi.yaml; run `make generate`.
package: api
generate:
  models: true
  std-http-server: true
  strict-server: true
  client: true
output-options:
  prefer-skip-optional-pointer: true
  # The live-update WebSocket is served by a plain handler: an upgrade has no
  # request or response body for the generated server or client to handle.
  # So is the LiveKit webhook: verifying its signature needs the body as
  # sent, before anything decodes it.
  exclude-operation-ids: [openLive, receiveLiveKitWebhook, uploadAttachment, getAttachmentLimits, getAttachment, cancelAttachment, getAttachmentContent]
  # Keep the event schemas, which no operation references.
  skip-prune: true
compatibility:
  # Enum constants stay unambiguous as the contract grows (HealthStatusOk).
  always-prefix-enum-values: true
