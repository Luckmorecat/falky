# The Falky stack on one host: Caddy serves HTTPS and the web client, and proxies
# the API and LiveKit's signalling; LiveKit carries voice and screen share; the
# server keeps the rooms, chat and visitors.
#
#   cp deploy/.env.example deploy/.env   # then fill it in
#   docker compose -f deploy/compose.yaml up -d --build
#   docker compose -f deploy/compose.yaml exec falky /falky password set
#
# docs/runbook.md covers running it: health, operator commands, snapshots and
# restoring them, logs.
#
# `make smoke` then checks a local stack end to end through Caddy (see
# server/cmd/smoke). It replaces the access password: run it only on a stack
# nobody uses.
#
# Only Caddy's ports and LiveKit's media ports are published. The server's
# public listener is reached only through Caddy, its internal listener (health,
# metrics, LiveKit's webhooks) only from this Compose network, and its admin
# socket only inside its container. LiveKit's API port stays on this network.

name: ${FALKY_PROJECT_NAME:-falky}

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  caddy:
    # Caddy with the built web client inside.
    build: ../web
    image: falky-caddy:local
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      FALKY_DOMAIN: ${FALKY_DOMAIN:?set FALKY_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      falky:
        condition: service_healthy
      livekit:
        condition: service_started
    logging: *logging

  falky:
    build: ../server
    image: falky-server:local
    restart: unless-stopped
    environment:
      FALKY_PUBLIC_ORIGIN: https://${FALKY_DOMAIN:?set FALKY_DOMAIN in deploy/.env}
      FALKY_ATTACHMENT_ROOT: ${FALKY_ATTACHMENT_ROOT:-/data/attachments}
      FALKY_ATTACHMENT_POSTED_BYTES: ${FALKY_ATTACHMENT_POSTED_BYTES:-5000000000}
      FALKY_LIVEKIT_API_URL: http://livekit:7880
      FALKY_LIVEKIT_API_KEY: ${FALKY_LIVEKIT_API_KEY:?set FALKY_LIVEKIT_API_KEY in deploy/.env}
      FALKY_LIVEKIT_API_SECRET: ${FALKY_LIVEKIT_API_SECRET:?set FALKY_LIVEKIT_API_SECRET in deploy/.env}
    volumes:
      - falky_data:/data
      # Where `falky snapshot` writes; kept apart from the live database.
      - falky_snapshots:/snapshots
    # Ready means the database is open and migrated; LiveKit being unreachable
    # leaves the server ready, with voice reported degraded.
    healthcheck:
      test: ["CMD", "/falky", "health", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 2s
    # Longer than the server's own shutdown timeout.
    stop_grace_period: 15s
    logging: *logging

  livekit:
    image: livekit/livekit-server:v1.13.11@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      # The same key pair the server signs tokens and verifies webhooks with.
      # LiveKit reads each config key from LIVEKIT_<KEY> as well (listed by
      # `livekit-server help-verbose`): LIVEKIT_WEBHOOK_API_KEY is
      # webhook.api_key, the key its webhooks are signed with.
      LIVEKIT_KEYS: "${FALKY_LIVEKIT_API_KEY:?set FALKY_LIVEKIT_API_KEY in deploy/.env}: ${FALKY_LIVEKIT_API_SECRET:?set FALKY_LIVEKIT_API_SECRET in deploy/.env}"
      LIVEKIT_WEBHOOK_API_KEY: ${FALKY_LIVEKIT_API_KEY:?set FALKY_LIVEKIT_API_KEY in deploy/.env}
      # The address clients send media to.
      NODE_IP: ${LIVEKIT_NODE_IP:?set LIVEKIT_NODE_IP in deploy/.env}
      LIVEKIT_RTC_TCP_PORT: ${LIVEKIT_TCP_PORT:-7881}
      LIVEKIT_RTC_UDP_PORT_START: ${LIVEKIT_UDP_PORT:-7882}
      LIVEKIT_RTC_UDP_PORT_END: ${LIVEKIT_UDP_PORT:-7882}
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "${LIVEKIT_TCP_PORT:-7881}:${LIVEKIT_TCP_PORT:-7881}/tcp"
      - "${LIVEKIT_UDP_PORT:-7882}:${LIVEKIT_UDP_PORT:-7882}/udp"
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  falky_data:
  falky_snapshots:
