name: Build web image

# Called only after the release workflow's complete check gate.
on:
  workflow_call:
    inputs:
      dev_stats:
        description: Enable development screen-share statistics in the built client
        type: boolean
        default: false
    outputs:
      digest:
        description: Immutable image digest built from this workflow's source
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: read

jobs:
  publish:
    name: Publish web image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record source revision
        id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-web" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish web image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: web/
          file: web/Dockerfile
          platforms: linux/amd64
          build-args: |
            VITE_DEV_STATS=${{ inputs.dev_stats }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_type == 'tag' && github.ref_name || steps.source.outputs.revision }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
