name: Release Please

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Separate from both deployment locks. New pushes may coalesce while a run is
# active; the next run reads current master and all pending release PRs.
concurrency:
  group: release-please-master
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Luckmorecat/falky' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install locked release tooling
        run: npm --prefix release ci --ignore-scripts
      - name: Create repository-scoped release token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          # Required if an exact merge SHA has older workflows than master.
          permission-workflows: write
      - name: Publish merged releases and update the rolling release PR
        env:
          RELEASE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node release/run.mjs
