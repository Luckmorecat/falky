name: Deploy VPS

on:
  pull_request:
    branches: [master, staging]
    # Body edits must revalidate the ban on release-note commit overrides.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [master, staging]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: Prepare artifacts only; use master for development, staging for staging, or a v* tag for production
        required: true
        type: choice
        default: development
        options: [development, staging, production]

permissions:
  contents: read

# Serialize the whole build/deploy sequence for each environment, so a slower
# old build cannot overtake a newer deployment. Never cancel an active deploy.
concurrency:
  group: vps-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || (github.ref_type == 'tag' && 'production' || github.ref == 'refs/heads/staging' && 'staging' || 'development') }}
  cancel-in-progress: false

jobs:
  checks:
    name: Check ${{ matrix.component }}
    if: github.repository == 'Luckmorecat/falky'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        component: [server, web, deploy]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ matrix.component != 'web' && '0' || '1' }}
      - name: Decide whether component checks are required
        if: matrix.component != 'web'
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/ci-check.py ${{ matrix.component }}
      - name: Install pinned tools
        if: matrix.component != 'web' && steps.validation.outputs.run != 'false'
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - name: Locate Go caches
        if: matrix.component == 'server' && steps.validation.outputs.run != 'false'
        id: go-cache
        working-directory: server
        run: |
          {
            echo "version=$(go env GOVERSION)"
            echo "modules=$(go env GOMODCACHE)"
            echo "build=$(go env GOCACHE)"
          } >> "$GITHUB_OUTPUT"
      - name: Cache Go modules
        if: matrix.component == 'server' && steps.validation.outputs.run != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.modules }}
          key: go-mod-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.version }}-${{ hashFiles('server/go.mod', 'server/go.sum') }}
          restore-keys: |
            go-mod-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.version }}-
      - name: Cache Go build outputs
        if: matrix.component == 'server' && steps.validation.outputs.run != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.build }}
          key: go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.version }}-${{ hashFiles('server/go.mod', 'server/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.version }}-${{ hashFiles('server/go.mod', 'server/go.sum') }}-
            go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.version }}-
      - name: Install Node.js runtime
        if: matrix.component == 'web' || (matrix.component == 'deploy' && (steps.validation.outputs.run != 'false' || github.event_name == 'pull_request'))
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install web package manager
        if: matrix.component == 'web'
        run: npm install --global "$(node -p 'require("./web/package.json").packageManager')"
      - name: Run component checks
        if: steps.validation.outputs.run != 'false'
        run: make check-${{ matrix.component }}
      - name: Install release tooling for incoming commit validation
        if: matrix.component == 'deploy' && steps.validation.outputs.run == 'false' && github.event_name == 'pull_request'
        run: npm --prefix release ci --ignore-scripts
      - name: Validate incoming individual commits
        if: matrix.component == 'deploy' && github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node release/validate-commits.mjs "$PR_BASE" "$PR_HEAD"

  # Keep one stable required check and release gate. A failed, cancelled or
  # skipped component must never produce a successful aggregate check.
  check:
    name: Check
    if: always() && github.repository == 'Luckmorecat/falky'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all component checks to pass
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
        run: test "$CHECK_RESULT" = success

  # Operator bootstrap must establish staging before CI can read its host baseline.
  plan:
    name: Plan release
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref != 'refs/heads/staging' || vars.STAGING_DEPLOY_ENABLED == 'true'))
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref_type == 'tag' && 'production' || github.ref == 'refs/heads/staging' && 'staging' || 'development' }}
    outputs:
      server: ${{ steps.plan.outputs.server }}
      web: ${{ steps.plan.outputs.web }}
      changed: ${{ steps.plan.outputs.changed }}
      mode: ${{ steps.plan.outputs.mode }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read the durable host release baseline
        if: github.event_name == 'push'
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          bash deploy/ci-ssh.sh release > "$RUNNER_TEMP/release-baseline.json"
      - name: Plan complete publishing or an exact pending retry
        id: plan
        env:
          PREPARE_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            python3 deploy/ci-plan.py prepare
          else
            python3 deploy/ci-plan.py plan "$RUNNER_TEMP/release-baseline.json"
          fi

  server:
    if: needs.plan.outputs.server == 'true'
    needs: plan
    uses: ./.github/workflows/publish-image.yml
    permissions:
      contents: read
      packages: write

  web:
    if: needs.plan.outputs.web == 'true'
    needs: plan
    uses: ./.github/workflows/publish-web-image.yml
    with:
      dev_stats: ${{ github.ref == 'refs/heads/master' }}
    permissions:
      contents: read
      packages: write

  deploy:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Prepare' || 'Deploy' }} ${{ github.ref_type == 'tag' && 'production' || github.ref == 'refs/heads/staging' && 'staging' || 'development' }}
    # Only exact pending retries skip both builds. New releases require both.
    if: >-
      !cancelled() && needs.check.result == 'success' &&
      needs.plan.result == 'success' && needs.plan.outputs.changed == 'true' &&
      ((needs.plan.outputs.mode == 'retry' && needs.server.result == 'skipped' && needs.web.result == 'skipped') ||
      (needs.plan.outputs.mode != 'retry' && needs.server.result == 'success' && needs.web.result == 'success'))
    needs: [check, plan, server, web]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    environment:
      name: ${{ github.ref_type == 'tag' && 'production' || github.ref == 'refs/heads/staging' && 'staging' || 'development' }}
      url: ${{ vars.APP_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve immutable images and package the exact runtime
        id: artifact
        env:
          RELEASE_PLAN: ${{ needs.plan.outputs.plan }}
          SERVER_RESULT: ${{ needs.server.result }}
          WEB_RESULT: ${{ needs.web.result }}
          SERVER_DIGEST: ${{ needs.server.outputs.digest }}
          WEB_DIGEST: ${{ needs.web.outputs.digest }}
        run: |
          set -euo pipefail
          command=$(python3 deploy/ci-plan.py resolve "$RUNNER_TEMP/runtime-artifact")
          echo "command=$command" >> "$GITHUB_OUTPUT"
      - name: Retain exact runtime package and release manifest
        if: needs.plan.outputs.mode != 'retry'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: falky-runtime-${{ github.ref_type == 'tag' && 'production' || github.ref == 'refs/heads/staging' && 'staging' || 'development' }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-artifact/
          if-no-files-found: error
          retention-days: 90
      - name: Install complete release or resume exact pending attempt
        if: github.event_name == 'push'
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          RELEASE_COMMAND: ${{ steps.artifact.outputs.command }}
          RELEASE_MODE: ${{ needs.plan.outputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_MODE" == retry ]]; then
            bash deploy/ci-ssh.sh "$RELEASE_COMMAND" < /dev/null
          else
            bash deploy/ci-ssh.sh "$RELEASE_COMMAND" < "$RUNNER_TEMP/runtime-artifact/runtime.tar"
          fi
