name: Deploy VPS

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

# Serialize the whole build/deploy sequence for each environment, so a slower
# old build cannot overtake a newer deployment. Never cancel an active deploy.
concurrency:
  group: vps-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || (github.ref_type == 'tag' && 'production' || 'development') }}
  cancel-in-progress: false

jobs:
  check:
    name: Check
    if: github.repository == 'Luckmorecat/falky'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - name: Run complete check gate
        run: make check
      - name: Check deployment scripts and workflows
        run: |
          bash -n deploy/manage.sh deploy/compose.sh deploy/ci-deploy.sh deploy/ci-ssh.sh
          python3 deploy/manage_test.py
          python3 deploy/release_test.py
          python3 deploy/config_test.py
          actionlint

  plan:
    name: Plan release
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref_type == 'tag' && 'production' || 'development' }}
    outputs:
      server: ${{ steps.plan.outputs.server }}
      web: ${{ steps.plan.outputs.web }}
      changed: ${{ steps.plan.outputs.changed }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compare inputs with this environment's successful release
        id: plan
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          bash deploy/ci-ssh.sh release > "$RUNNER_TEMP/release-baseline.json"
          python3 deploy/release.py plan "$RUNNER_TEMP/release-baseline.json"

  server:
    if: needs.plan.outputs.server == 'true'
    needs: plan
    uses: ./.github/workflows/publish-image.yml
    permissions:
      contents: read
      packages: write

  web:
    if: needs.plan.outputs.web == 'true'
    needs: plan
    uses: ./.github/workflows/publish-web-image.yml
    permissions:
      contents: read
      packages: write

  deploy:
    name: Deploy ${{ github.ref_type == 'tag' && 'production' || 'development' }}
    # Planned skips are valid. Failures/cancellation must never become reuse.
    if: >-
      !cancelled() && needs.check.result == 'success' &&
      needs.plan.result == 'success' && needs.plan.outputs.changed == 'true' &&
      (needs.server.result == 'success' || needs.server.result == 'skipped') &&
      (needs.web.result == 'success' || needs.web.result == 'skipped')
    needs: [check, plan, server, web]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    environment:
      name: ${{ github.ref_type == 'tag' && 'production' || 'development' }}
      url: ${{ github.ref_type == 'tag' && 'https://falky.lunari.win' || 'https://dev.falky.lunari.win' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve immutable images and deploy against the verified baseline
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          RELEASE_PLAN: ${{ needs.plan.outputs.plan }}
          SERVER_RESULT: ${{ needs.server.result }}
          WEB_RESULT: ${{ needs.web.result }}
          SERVER_DIGEST: ${{ needs.server.outputs.digest }}
          WEB_DIGEST: ${{ needs.web.outputs.digest }}
        run: |
          set -euo pipefail
          command=$(python3 deploy/release.py resolve)
          bash deploy/ci-ssh.sh "$command"
