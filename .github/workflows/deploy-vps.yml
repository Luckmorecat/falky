name: Deploy VPS

on:
  workflow_run:
    workflows: [Publish server image, Publish web image]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      component:
        description: Component to update
        type: choice
        options: [all, backend, frontend]
        default: all
        required: true

permissions: {}

jobs:
  deploy:
    name: Deploy production
    if: >-
      github.repository == 'Luckmorecat/falky' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: https://falky.lunari.win
    concurrency:
      # Keep one pending update for each component; a web event cannot replace
      # a queued backend event. The VPS operations lock serializes execution.
      group: vps-production-${{ github.event_name == 'workflow_dispatch' && inputs.component || (github.event.workflow_run.name == 'Publish server image' && 'backend' || 'frontend') }}
      cancel-in-progress: false
    steps:
      - name: Configure deployment SSH key and trusted host
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY" || { echo "Missing production secret VPS_SSH_KEY" >&2; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo "Missing production variable VPS_KNOWN_HOSTS" >&2; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/vps-ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/vps-ssh/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/vps-ssh/known_hosts"
      - name: Deploy published component
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          PUBLISHED_WORKFLOW: ${{ github.event.workflow_run.name }}
          MANUAL_COMPONENT: ${{ inputs.component }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ $VPS_HOST =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo "Invalid production variable VPS_HOST" >&2; exit 1; }
          if [[ $EVENT_NAME == workflow_dispatch ]]; then
            component=$MANUAL_COMPONENT
          else
            case "$PUBLISHED_WORKFLOW" in
              'Publish server image') component=backend ;;
              'Publish web image') component=frontend ;;
              *) echo "Unexpected publishing workflow" >&2; exit 1 ;;
            esac
          fi
          case "$component" in
            all) command=deploy ;;
            backend) command='deploy backend' ;;
            frontend) command='deploy frontend' ;;
            *) echo "Invalid deployment component" >&2; exit 1 ;;
          esac
          ssh -F /dev/null -T \
            -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none \
            -o StrictHostKeyChecking=yes -o UpdateHostKeys=no \
            -o UserKnownHostsFile="$RUNNER_TEMP/vps-ssh/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -i "$RUNNER_TEMP/vps-ssh/key" -l deployer "$VPS_HOST" "$command"
      - name: Remove temporary credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/vps-ssh"
