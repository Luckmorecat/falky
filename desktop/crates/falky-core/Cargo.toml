[package]
name = "falky-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
native-audio = ["dep:cpal", "dep:livekit", "dep:livekit-net", "dep:livekit-protocol", "dep:prost", "dep:sha2"]

[dependencies]
bytes.workspace = true
chrono.workspace = true
cpal = { workspace = true, optional = true }
directories = "6"
futures-util.workspace = true
livekit = { version = "0.12.1", features = ["rustls-tls-native-roots"], optional = true }
livekit-net = { version = "=0.2.0", optional = true }
livekit-protocol = { version = "0.9", optional = true }
log = { version = "0.4", features = ["max_level_info"] }
prost = { version = "0.14", optional = true }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }
sha2 = { version = "0.10", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
