[package]
name = "falky-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
arboard = { version = "3.7", features = ["wayland-data-control"] }
bytemuck = { version = "1", features = ["derive"] }
bytes.workspace = true
chrono.workspace = true
directories = "6"
falky-core = { path = "../falky-core", features = ["native-audio"] }
futures-util.workspace = true
iced.workspace = true
image.workspace = true
lru = "0.16"
notify-rust = "4"
open = "5"
raw-window-handle = "0.6"
reqwest.workspace = true
rfd = "0.17"
serde.workspace = true
serde_json.workspace = true
sys-locale = "0.3"
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
url.workspace = true
uuid.workspace = true
wgpu = "27"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", features = ["global_shortcuts", "screencast", "wayland"] }
futures-executor = "0.3"
global-hotkey = "0.10"
ksni = "0.3"
pipewire = "0.10"
wayland-client = "0.31"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = { version = "0.3", features = ["objc2"] }
handy-keys = "0.3"
libc = "0.2"
objc2 = "0.6"
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["CFArray", "CFDictionary", "CFNumber", "CFCGTypes", "objc2"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGGeometry"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["CMSampleBuffer", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMTime", "objc2", "objc2-core-video", "objc2-core-audio-types"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["alloc", "NSError", "NSProcessInfo", "NSString", "NSValue"] }
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
handy-keys = "0.3"
tray-icon = { version = "0.26", default-features = false }

windows = { version = "0.62.2", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT_Direct3D11",
    "Win32_UI_Shell",
] }
windows-core = "0.62.2"
windows-future = "0.3.2"
windows-version = "0.1.7"

[dev-dependencies]
tempfile = "3"
