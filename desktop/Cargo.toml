[workspace]
members = ["crates/falky-core", "crates/falky-desktop"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
cpal = "=0.17.3"
futures-util = "0.3"
iced = { version = "0.14", features = ["tokio", "image-without-codecs", "svg", "canvas", "advanced", "qr_code"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
reqwest = { version = "0.12.28", default-features = false, features = ["cookies", "json", "multipart", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
